[log]
level = "info"
format = "text"

[server]
# Loopback by default. Set "0.0.0.0" to expose the server on all interfaces
# (make sure to set an auth.api_key when doing so).
host = "127.0.0.1"
port = 8080

[database]
path = "skopos.db"

[auth]
# API key; when set, required by every endpoint (REST, MCP, SSE). Empty disables
# authentication and is only allowed on loopback binds unless the server is
# started with --insecure-no-api-key.
api_key = ""

[health]
stuck_threshold_minutes = 15

[cleanup]
# Days to retain data before automatic cleanup (0 disables the cleanup worker).
retention_days = 30

[client]
# Written by `skopos setup` when you choose the remote workflow. When set,
# index push/query commands talk to this server without needing flags.
# server_url = "http://localhost:8080"
# api_key = ""

[codeindex]
# Directory for per-workspace code index databases. Server-side refresh
# checkouts live under <dir>/checkouts/.
dir = "indexes"

[codeindex.embeddings]
# Semantic code search — optional, disabled by default.
# Any OpenAI-compatible /v1/embeddings endpoint works; a local Ollama keeps
# everything on-host (no API key needed):
#   url = "http://localhost:11434/v1"
url = ""
model = ""
# api_key = ""   # only for hosted endpoints

# Vector backend: "sqlite" (embedded brute force — fine to ~300k symbols per
# workspace) or "qdrant" (external vector DB over REST, for monorepo scale).
vector_store = "sqlite"
# qdrant_url = "https://qdrant.example.com"
# qdrant_api_key = ""
