[log]
level = "info"
format = "text"

[server]
# Loopback by default. Set "0.0.0.0" to expose the server on all interfaces
# (make sure to set an auth.api_key when doing so).
host = "127.0.0.1"
port = 8080

[database]
path = "skopos.db"

[auth]
# API key; when set, required by every endpoint (REST, MCP, SSE). Empty disables
# authentication and is only allowed on loopback binds unless the server is
# started with --insecure-no-api-key.
api_key = ""
# ^ The ROOT key: full access plus exclusive key/workspace management.
# Mint per-agent scoped keys after startup: skopos key create (docs/concepts/api-keys.md)

[health]
stuck_threshold_minutes = 15

[cleanup]
# Days to retain data before automatic cleanup (0 disables the cleanup worker).
retention_days = 30

[client]
# Written by `skopos setup` when you choose the remote workflow. When set,
# index push/query commands talk to this server without needing flags.
# server_url = "http://localhost:8080"
# api_key = ""

[codeindex]
# Directory for per-workspace code index databases. Server-side refresh
# checkouts live under <dir>/checkouts/.
dir = ".skopos/indexes"
# Poll registered git_url workspaces for server-side refresh (e.g. "30m";
# unset/0 = manual refresh only, or trigger from CI: POST /api/codeindex/<ws>/refresh).
# refresh_interval = "30m"

[codeindex.embeddings]
# Semantic code search — optional, disabled by default.
# Any OpenAI-compatible /v1/embeddings endpoint works; a local Ollama keeps
# everything on-host (no API key needed):
#   url = "http://localhost:11434/v1"
url = ""
model = ""
# api_key = ""   # only for hosted endpoints

# Vector backend: "sqlite" (embedded brute force — fine to ~300k symbols per
# workspace) or "qdrant" (external vector DB over REST, for monorepo scale).
vector_store = "sqlite"
# qdrant_url = "https://qdrant.example.com"
# qdrant_api_key = ""

[worker]
# The execution plane (`skopos worker`). Scaffold with: skopos worker init.
# id must keep the "worker-" prefix (marks worker-created plans so the
# server's orphan cleanup never touches hand-made ones).
# id = "worker-<hostname>"
state_dir = "~/.local/state/skopos-worker"
runners = ["claude"]
workspaces = []
poll_every = "30s"

# One block per workspace this worker serves — ids contain '/', so the table
# key is quoted. Worktrees are cut from the local clone per run.
# [worker.repos."github.com/you/repo"]
# path = "/srv/clones/repo"
# default_branch = "main"
# branch_prefix = "agent/"
# setup = []
# setup_env = { COMPOSER_AUTH = "${COMPOSER_AUTH}" }   # setup runs with a scrubbed env
# profile = "php"                 # a [worker.profiles.<name>] entry
# checks = ["task test"]
# protected_branches = ["PROD", "main", "master", "develop", "release/**"]
# [worker.repos."github.com/you/repo".push]
# kind = "gitea"                   # gitea | github | none
# remote_url = "https://git.example.com/you/repo.git"
# token_env = "GITEA_PUSH_TOKEN"   # set the value in skopos-worker.env, never here

# The credential pool: picked at run start; a session stays on the account
# that created it. env values are injected into the agent run only.
# [[worker.accounts]]
# name = "claude-1"
# runner = "claude"
# priority = 1
# env = { ANTHROPIC_API_KEY = "${CLAUDE_1_API_KEY}" }   # the value lives in skopos-worker.env

# Runners: an account's runner picks the agent CLI — "claude" (default) and
# "opencode" have verified lockdowns; any other CLI via kind = "command"
# runs only inside a wrapper (fail closed).
# [worker.runner_config.opencode]
# config = "~/.config/skopos/opencode-providers.json"   # providers/models; secrets as {env:VAR}
# [worker.runner_config.aider]
# kind = "command"
# command = ["aider", "--yes", "--message", "{prompt}"]

# MCP servers for pipeline runs. Agent runs load NO user/project settings
# (no ~/.claude.json servers, no CLAUDE.md, no hooks), so the servers they
# may use come from this file (Claude Code mcpServers JSON); mcp_servers is
# the allowlist of their tool prefixes. Required when mcp_servers is set.
# mcp_config = "~/.config/skopos/worker-mcp.json"
# mcp_servers = ["mcp__skopos"]

# Profiles: how YOU contain a stage — skopos provides no isolation itself.
# A stage is contained by a wrapper (argv prefix the agent command is
# appended to: a container, a VM, a sandbox tool; {dir} {run} {stage}
# {workspace} expand) or by settings enabling Claude Code's own sandbox.
# Only a contained stage may be granted capabilities (tools, env) — an
# uncontained grant is a config error. Repos opt in with profile = "<name>".
# [worker.profiles.php.implement]
# wrapper = ["docker", "run", "--rm", "-i", "-v", "{dir}:{dir}", "-w", "{dir}", "-e", "ANTHROPIC_API_KEY", "ghcr.io/you/agent-php@sha256:..."]
# tools = ["Bash(php:*)", "Bash(composer:*)", "Bash(vendor/bin/phpstan:*)", "Bash(vendor/bin/phpunit:*)"]
# [worker.profiles.php.review]
# settings = '{"sandbox":{"enabled":true}}'
# tools = ["Bash(vendor/bin/phpstan:*)", "Bash(vendor/bin/phpunit:*)"]
# go-scaffolder:config-sections
