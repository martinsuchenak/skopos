version: 2

project_name: skopos

# Releases: binaries for every platform, checksums, SBOMs, keyless
# signatures, a multi-arch image on ghcr.io and a Homebrew cask. Run by
# .github/workflows/release.yml when `task release -- vX.Y.Z` pushes a tag.
# See docs/development.md.
#
# There is no before hook: the workflow builds the dashboard (web/dist) in a
# job of its own and hands it over, so nothing but GoReleaser runs in the
# step that holds the signing secrets. CI has already run the tests on the
# tagged commit (`task release` waits for it).

builds:
  - id: skopos
    main: .
    binary: skopos
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/martinsuchenak/skopos/build.Version={{.Version}}
      - -X github.com/martinsuchenak/skopos/build.Commit={{.ShortCommit}}
      - -X github.com/martinsuchenak/skopos/build.Date={{.Date}}

# Sign the macOS binaries with the Developer ID certificate and notarize them
# with Apple, on the Linux runner (GoReleaser's cross-platform signer, quill),
# before they are archived — so the archives and the bare binaries that
# workers self-upgrade from are both the signed ones. Skipped unless the
# MACOS_* secrets are set, so a fork or a local snapshot builds without them.
# Setup: docs/development.md, "macOS signing and notarization".
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [skopos]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - skopos-config.example.toml
  # The bare binary under a name without the version, so
  # releases/latest/download/skopos_<os>_<arch> always fetches the newest
  # release (provisioning scripts, `curl -o`), and workers self-upgrade from
  # releases/download/v<version>/skopos_<os>_<arch> (internal/worker/upgrade.go).
  - id: binary
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Covers the archives and the bare binaries; self-upgrade verifies against it.
checksum:
  name_template: checksums.txt

# SPDX JSON software bill of materials for each archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless cosign signatures (GitHub OIDC). The checksum file covers every
# archive and binary; SBOMs are signed separately. Verify with
# `cosign verify-blob --bundle`. The release workflow fetches Sigstore's trust
# root and signing config once and passes them in SIGSTORE_TRUSTED_ROOT and
# SIGSTORE_SIGNING_CONFIG, so the signings GoReleaser runs at once never write
# cosign's TUF cache together.
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--signing-config={{ .Env.SIGSTORE_SIGNING_CONFIG }}"
      - "--trusted-root={{ .Env.SIGSTORE_TRUSTED_ROOT }}"
      - "${artifact}"
      - "--yes"
  - id: sbom
    cmd: cosign
    artifacts: sbom
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--signing-config={{ .Env.SIGSTORE_SIGNING_CONFIG }}"
      - "--trusted-root={{ .Env.SIGSTORE_TRUSTED_ROOT }}"
      - "${artifact}"
      - "--yes"

# Multi-arch image on GitHub's container registry, from the release binaries.
dockers_v2:
  - id: skopos
    ids: [skopos]
    dockerfile: Dockerfile.release
    extra_files:
      - skopos-config.example.toml
      - LICENSE
    images:
      - ghcr.io/martinsuchenak/skopos
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: skopos
      org.opencontainers.image.description: "AI agent coordination: shared memory, plans, real-time status and an agent pipeline"
      org.opencontainers.image.source: "https://github.com/martinsuchenak/skopos"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT

# Keyless cosign signatures for the images, like the archives. Verify with
# `cosign verify ghcr.io/martinsuchenak/skopos:<version>
#  --certificate-identity-regexp 'https://github.com/martinsuchenak/skopos/'
#  --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "--signing-config={{ .Env.SIGSTORE_SIGNING_CONFIG }}"
      - "--trusted-root={{ .Env.SIGSTORE_TRUSTED_ROOT }}"
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

homebrew_casks:
  - name: skopos
    ids:
      - default
    repository:
      owner: martinsuchenak
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/martinsuchenak/skopos
    description: AI agent coordination dashboard — shared memory, plans, and real-time status
    binaries:
      - skopos
    # A release built without the MACOS_* secrets is not notarized, and macOS
    # would quarantine it; this lifts the quarantine for the installed binary
    # only (harmless on a notarized one). Homebrew's declarative install
    # steps (GoReleaser 2.19+).
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/skopos"]
          end
