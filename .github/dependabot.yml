# Keeps the commit-pinned GitHub Actions in .github/workflows up to date: a
# weekly pull request moves each pin to the latest release, with the version
# in the trailing comment. Go modules, the dashboard's packages and the
# Dockerfiles' base images too; minor and patch updates are grouped to keep
# the pull request count low.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    # paularlott/mcp 0.33.x takes any request carrying Mcp-Method for the
    # 2026-07-25 protocol and refuses 2025-11-25 clients (mcp-remote, Claude
    # Code) with "Header mismatch" (skopos 0.21.1). Pinned at 0.25.0 until a
    # release accepts them; cmd/mcp's TestLegacyClientHeadersAreAccepted
    # checks a bump.
    ignore:
      - dependency-name: github.com/paularlott/mcp
    commit-message:
      prefix: deps

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
