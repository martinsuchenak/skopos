name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The dashboard is built here, apart from the release job: `bun install`
  # runs third-party code, and none of it may run where the signing secrets
  # and the OIDC token are. GoReleaser embeds the result (web/dist).
  frontend:
    name: Dashboard bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Build the dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: GoReleaser
    needs: frontend
    # Pinned so runner image migrations don't change release builds unannounced.
    runs-on: ubuntu-24.04
    # Keyless cosign signing and build provenance attestations use the job's OIDC
    # token, so every action in this job is pinned to a commit SHA.
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the dashboard bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      # A release binary without the dashboard serves 404s with no error
      # anywhere (web.VerifyAssets); refuse to build one.
      - name: Check the bundle
        run: test "$(wc -c < web/dist/app.js)" -ge 1024

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # GoReleaser runs several cosign signings at once. Each would read
      # Sigstore's TUF repository and rewrite the same cache, and two writing
      # together fail the release ("tuf refresh failed: failed to persist
      # metadata"); cosign rewrites it on every run, even after initialize.
      # So the trust root and signing config are fetched once here and given
      # to every signing (.goreleaser.yml), which then leaves the cache alone.
      - name: Fetch Sigstore's trust root and signing config
        run: |
          cosign initialize
          targets="${TUF_ROOT:-$HOME/.sigstore/root}/tuf-repo-cdn.sigstore.dev/targets"
          out="$RUNNER_TEMP/sigstore"
          mkdir -p "$out"
          cp "$targets/trusted_root.json" "$out/trusted_root.json"
          config=$(ls "$targets"/signing_config*.json | sort | tail -n 1)
          cp "$config" "$out/signing_config.json"
          echo "SIGSTORE_TRUSTED_ROOT=$out/trusted_root.json" >> "$GITHUB_ENV"
          echo "SIGSTORE_SIGNING_CONFIG=$out/signing_config.json" >> "$GITHUB_ENV"

      # The release pushes a multi-arch image to ghcr.io (see dockers_v2).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          if ./scripts/changelog-section.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"; then
            echo "args=--release-notes=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME}; falling back to GoReleaser's generated changelog"
          fi

      # A re-run of the workflow for the same tag replaces the release.
      - name: Delete release
        run: gh release delete ${{ github.ref_name }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # macOS signing and notarization; skipped while these are unset.
          # Nothing else runs in this step (there is no before hook), so no
          # dependency's install script can read them.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
