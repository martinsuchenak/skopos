name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit hashes (a tag or branch can be moved to other
# code); Dependabot (.github/dependabot.yml) proposes updates to the pins.
# build/ci_test.go fails on an unpinned one. Tools are installed at fixed
# versions, so a run means the same thing as `task check` here. Go comes from
# go.mod's go line, the version releases build with.

env:
  BUN_VERSION: '1.4.4'
  TASK_VERSION: 'v3.53.1'
  GOLANGCI_LINT_VERSION: 'v2.15.0'
  GOVULNCHECK_VERSION: 'v1.8.0'

jobs:
  go:
    name: Go (fmt, vet, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}

      # The tests check the embedded bundle is a real build
      # (web.TestVerifyAssets), so they run against one.
      - name: Build the dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Check formatting
        run: task fmt:check

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: task vet

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          task lint

      - name: Test
        run: go test ./... -count=1

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  race:
    name: Go (race detector)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # As in the Go job: the dashboard tests need a real bundle.
      - name: Build the dashboard
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Test with race detector
        run: go test ./... -count=1 -race -timeout 30m

  # The release builds every platform; catch a build that breaks on one
  # before a tag, not after it. One job per target, in parallel. linux/amd64
  # is the tests' own platform.
  cross:
    name: Go (cross-compile ${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, windows/arm64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          TARGET: ${{ matrix.target }}
        run: CGO_ENABLED=0 GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build -o /dev/null .

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t skopos:ci .

      - name: Check the image runs
        run: docker run --rm skopos:ci --version

      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
