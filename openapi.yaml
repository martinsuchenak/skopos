openapi: "3.1.0"
info:
  title: skopos
  version: "1.0.0"
  description: >
    Skopos coordinates AI agent status, a shared blackboard, and plans across
    sessions and branches.

    REST API, dashboard, and MCP (at `/mcp`) are all served on one HTTP server
    (default :8080).

    When an API key is configured, every endpoint (reads, writes, MCP, SSE)
    requires it, sent as `Authorization: Bearer <key>`.
    When no API key is configured, authentication is disabled.

    A key with the delegate permission (or the root key) may send
    `X-Skopos-On-Behalf-Of: <person>` (an email or username, at most 200
    characters) to name the person it acts for; the audit log, approvals and
    answers record "<person> (key <name>)". Other keys sending it get 400.

    POSTs under `/api/inbox` accept an `Idempotency-Key` header (1-255
    printable characters): the same key with the same request within 24
    hours answers the stored response (`Idempotent-Replayed: true`) instead
    of acting again; the same key with a different request answers 422, and
    one still running 409. Keys are kept per API key, and only successful
    responses are kept: a refused or failed request can be retried with the
    same key. The person named by X-Skopos-On-Behalf-Of is part of the
    request.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /metrics:
    get:
      summary: Runtime metrics
      operationId: getMetrics
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Current metrics (goroutines, allocation)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ---- status / sessions ----
  /api/reports:
    post:
      summary: Report an agent status update
      operationId: reportStatus
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "400": { description: Invalid report, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
  /api/sessions:
    get:
      summary: List sessions
      operationId: listSessions
      security: [{ BearerAuth: [] }]
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
          description: Filter by workspace path/id.
      responses:
        "200":
          description: Session summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionSummary" }
    delete:
      summary: Bulk-delete sessions (the optional workspace, or every session on the server)
      operationId: purgeSessions
      security: [{ BearerAuth: [] }]
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
          description: Limit the purge to one workspace. Omit to delete EVERY session (root key only). Cascades to events, agent states, and session-scoped blackboard entries.
      responses:
        "200":
          description: "Purge result: { deleted: N }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential, or root key required for the all-workspaces purge" }
  /api/sessions/{id}:
    get:
      summary: Get a session (with agents and events)
      operationId: getSession
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404": { description: Session not found }
    delete:
      summary: Delete a session (cascades to its agents, events, and session-scoped blackboard entries)
      operationId: deleteSession
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
  /api/sessions/{id}/events:
    get:
      summary: List events for a session
      operationId: listSessionEvents
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Session events (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }

  # ---- workspaces ----
  /api/events/stream:
    get:
      summary: Server-Sent Events stream (live UI updates)
      operationId: eventStream
      security: [{ BearerAuth: [] }]
      description: >
        Returns a persistent text/event-stream. The server publishes named
        events (sessions, blackboard, plans, workspaces, change) whenever a
        successful mutation occurs. Clients use EventSource to subscribe and
        re-fetch the affected view on each event.
      responses:
        "200":
          description: SSE stream of change events
          content:
            text/event-stream:
              schema:
                type: string
                description: "Lines of event: <type> / data: <json> / blank"

  /api/whoami:
    get:
      summary: What can this credential access
      description: Resolves the caller's principal and the accessible slice of the workspace registry.
      operationId: whoami
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Principal and accessible workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Whoami" }
        "401": { description: Unauthorized }

  /api/keys:
    post:
      summary: Create a scoped API key (root only)
      operationId: createApiKey
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreateInput" }
      responses:
        "201":
          description: Key created — key_secret is shown only here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreateResult" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
    get:
      summary: List API keys including revoked (root only)
      operationId: listApiKeys
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Keys (no secrets)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { description: Unauthorized }
        "403": { description: Root key required }

  /api/keys/{id}:
    patch:
      summary: Edit an API key's name and/or workspace scope (root only)
      operationId: updateApiKey
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  workspaces:
                    description: Exact workspace ids, or ["*"] for all workspaces; omitted = unchanged
                    type: array
                    items: { type: string }
                  groups:
                    description: Workspace group names or ids; omitted = unchanged, [] clears
                    type: array
                    items: { type: string }
                  approver:
                    type: boolean
                    description: Approver permission; omitted = unchanged
                  admin:
                    type: boolean
                    description: Admin permission (change policy and configuration within the key's scope); omitted = unchanged
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400": { description: Invalid input or revoked key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
        "404": { description: Unknown key }
    delete:
      summary: Revoke an API key (root only; idempotent) or hard-delete it with hard=true
      operationId: revokeApiKey
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: hard
          in: query
          description: "true removes the key row entirely (cleanup of old/revoked keys) instead of soft-revoking"
          schema: { type: boolean }
      responses:
        "204": { description: Revoked or deleted }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
        "404": { description: Unknown key }

  /api/keys/who-can:
    get:
      summary: Which active keys can access a workspace, and how (root only)
      description: Reverse view of scope — explicit rows, group members, and group pattern matches.
      operationId: whoCanAccess
      security: [{ BearerAuth: [] }]
      parameters:
        - name: workspace
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Keys reaching the workspace, each with a via field ("explicit", "group:<name>" or "pattern:<group>:<pattern>")
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KeyReach" }
        "400": { description: Missing workspace, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: Root key required }

  /api/groups:
    post:
      summary: Create a workspace group (root only)
      operationId: createWorkspaceGroup
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { description: Invalid input (patterns are path.Match; no **), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
        "409": { description: Group name already exists }
    get:
      summary: List workspace groups (root only)
      operationId: listWorkspaceGroups
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Groups with members and patterns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { description: Unauthorized }
        "403": { description: Root key required }

  /api/groups/{id}/pipeline:
    get:
      summary: A group's pipeline settings (root only) — defaults its workspaces inherit per stage
      operationId: getGroupPipeline
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pipeline settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the root key }
        "404": { description: Not found or out of scope }
    put:
      summary: Set a group's pipeline settings (root only)
      description: >-
        Replaces the whole document at this level: stages it omits are
        cleared here (its workspaces then get nothing for that stage from this group). Audit-logged with what changed. Applies
        from the next queued stage.
      operationId: putGroupPipeline
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineSettingsInput" }
      responses:
        "200":
          description: Saved; the new view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineView" }
        "400": { description: Invalid settings (unknown stage, a list on a single-runner stage, bad focus or policy) }
        "409": { description: "The save newly names a runner the server defines whose declared provider and model the workspace's runner policy allows on no worker; the message names the runner, the stage and the policy" }
        "401": { description: Unauthorized }
        "403": { description: Requires the root key }
        "404": { description: Not found or out of scope }
        "409": { description: Another group already sets one of these stages (or the agents default) for a workspace this group holds }

  /api/policy/fleet/{level}:
    get:
      summary: The fleet's runner policy (any authenticated caller)
      operationId: getFleetPolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: level, in: path, required: true, schema: { type: string, enum: [ceiling, default] }, description: "ceiling: always applied to every workspace. default: for workspaces with no policy of their own and in no group that has one" }
      responses:
        "200":
          description: The policy at this level (policy null when none is set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Unknown level }
    put:
      summary: Set the fleet's runner policy (admin key that reaches all workspaces, or root)
      description: >-
        Replaces the policy at this level with the given allow rules, as a
        new revision. Refused with 409 when it would newly strand configured
        runners (a stage's runner that workers offer but none would be
        allowed to run) or drop a workspace's embedded code index, unless
        force is true. Audited as `policy.set` with the old and new revision.
      operationId: putFleetPolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: level, in: path, required: true, schema: { type: string, enum: [ceiling, default] }, description: "ceiling: always applied to every workspace. default: for workspaces with no policy of their own and in no group that has one" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: Saved (warnings lists what a forced save stranded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "400": { description: "Invalid policy: no rules, an unknown stage or kind" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Unknown level }
        "409": { description: The policy would strand current settings; the message lists them. Save with force }
    delete:
      summary: Remove the fleet's runner policy (admin key that reaches all workspaces, or root)
      description: The revisions stay; what then applies may be narrower (the fleet default instead of a workspace's own). `?force=true` as for PUT. Audited as `policy.delete`.
      operationId: deleteFleetPolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: level, in: path, required: true, schema: { type: string, enum: [ceiling, default] }, description: "ceiling: always applied to every workspace. default: for workspaces with no policy of their own and in no group that has one" }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Unknown level }
        "409": { description: Clearing would strand current settings; pass force=true }

  /api/workspaces/{id}/config:
    get:
      summary: A workspace's config on the server (any key with the workspace in scope)
      description: >-
        The part of a workspace's configuration every worker serving it
        shares: branches, setup and check commands, timeouts, push settings
        and the MCP allow and deny lists. A workspace with a config of its own
        is managed: those fields come from the server and the same fields in
        a worker's file are ignored. `effective` is what applies, with where
        each field comes from.
      operationId: getWorkspaceConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The stored config (config null when the workspace is not managed) and what applies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "401": { description: Unauthorized }
        "404": { description: Not found or out of scope }
    put:
      summary: Save a workspace's config (admin key with the workspace in scope)
      description: >-
        Replaces the workspace's config with the given fields, as a new
        revision; a field left out is not set at this level (its group's
        value, else the default, applies). Saving one makes the workspace
        managed. Refused when the merged result cannot work (a push without
        a remote URL). `setup`, `checks` and `preflight` run on every worker
        serving the workspace that has `worker.server_commands` on; their
        values are recorded in full. Audited as `config.update`
        (`config.import` when the request names the surface `import`) with
        the old and new revision and the fields changed.
      operationId: putWorkspaceConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigInput" }
      responses:
        "200":
          description: Saved (changed lists the fields that differ; empty when nothing changed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "400": { description: "Invalid config: an unknown field, a body without config, an unknown value, a limit exceeded, a push without a remote URL" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission for the workspace }
        "404": { description: Not found or out of scope }
        "409": { description: The stored revision is no longer if_rev }
    delete:
      summary: Remove a workspace's config (admin key with the workspace in scope)
      description: The workspace is no longer managed, and its workers go back to their own files. The revisions stay readable. Audited as `config.delete`.
      operationId: deleteWorkspaceConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission for the workspace }
        "404": { description: Not found or out of scope }

  /api/workspaces/{id}/config/effective:
    get:
      summary: What applies to a workspace now (any key with the workspace in scope)
      description: Its groups' configs in name order, then its own on top, as one set of fields. `managed` false means the server holds no config for it.
      operationId: getEffectiveWorkspaceConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The effective config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveConfig" }
        "401": { description: Unauthorized }
        "404": { description: Out of scope }

  /api/workspaces/{id}/config/{rev}:
    get:
      summary: The config a revision id names (any key with the workspace in scope)
      description: >-
        The effective config as it was when that revision was resolved, built
        from the stored revisions it stands for. A run's `config_rev` is such
        an id: the worker fetches it and runs under exactly that config.
      operationId: getWorkspaceConfigAt
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: rev, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The config at that revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveConfig" }
        "401": { description: Unauthorized }
        "404": { description: No such revision for this workspace, or out of scope }

  /api/groups/{id}/config:
    get:
      summary: A group's config (admin key whose scope covers every workspace in the group)
      operationId: getGroupConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Group id or name }
      responses:
        "200":
          description: The stored config (config null when none)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission for the group }
        "404": { description: Not found }
    put:
      summary: Save a group's config (admin key whose scope covers every workspace in the group)
      description: >-
        A group's values are defaults for its managed workspaces, field by
        field; they never make a workspace managed on their own. Refused with
        409 when another group already sets one of the fields for a workspace
        both contain, and with 400 when the result would leave a managed
        member with a config that cannot work.
      operationId: putGroupConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Group id or name }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "400": { description: Invalid config }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission for the group }
        "404": { description: Not found }
        "409": { description: Another group sets the same field for a shared workspace }
    delete:
      summary: Remove a group's config (admin key whose scope covers every workspace in the group)
      operationId: deleteGroupConfig
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Group id or name }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission for the group }
        "404": { description: Not found }

  /api/fleet/config:
    get:
      summary: The runner and wrapper definitions and the revision that names them (any key)
      description: What a worker fetches before it offers runners. Claim answers carry the revision as `Skopos-Fleet-Rev`.
      operationId: getFleetConfig
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The definitions (rev empty when there are none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rev: { type: string }
                  runners: { type: array, items: { $ref: "#/components/schemas/RunnerDef" } }
                  wrappers: { type: array, items: { $ref: "#/components/schemas/WrapperDef" } }
        "401": { description: Unauthorized }

  /api/fleet/mcp-servers:
    get:
      summary: List the MCP server definitions and which of their secrets are set (root or an admin key)
      description: Never a secret's value.
      operationId: listMCPServers
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp_servers:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/MCPServerDef" }
                        - type: object
                          properties:
                            rev: { type: string }
                            updated_at: { type: string, format: date-time }
                            updated_by: { type: string }
                            secrets:
                              type: array
                              description: The secrets the definition names, and whether each has a stored value
                              items:
                                type: object
                                properties:
                                  name: { type: string }
                                  set: { type: boolean }
                                  updated_at: { type: string, format: date-time }
                                  updated_by: { type: string }
                            used_by: { type: array, items: { type: string }, description: "The owners (workspace:<id>, group:<id>) whose config gives their runs the server. Only for an admin key that reaches every workspace" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission }

  /api/fleet/mcp-servers/{name}:
    put:
      summary: Define or redefine an MCP server for runs (admin key that reaches every workspace)
      description: >-
        Where the server is — an http URL with headers, or a command the
        worker runs with env — and the secrets it needs, by name. A credential
        is never part of the definition: it is named `${secret:NAME}` in the
        URL, a header or an env value, and its value is set apart
        (`PUT …/secrets/{secret}`). A header, variable or URL query parameter
        whose name looks like a credential (Authorization, a token, a key, a
        password, a session) must name a secret, and so must anything that
        reads as a generated token (in a URL path too); a credential may not
        be passed as a command argument. `workspaces` says which workspaces'
        runs may be given the server and is required when it names secrets.
        Changing an http server's host or a command server's command deletes
        its stored secrets. `${NAME}` in a command server's command and env is filled in
        on each worker from its `worker.vars`. A workspace's runs get the
        server when its config names it (`mcp`) and allows its tools
        (`mcp_servers`). Secrets a new definition no longer names are deleted.
        Audited as `mcp_server.create` / `mcp_server.update`.
      operationId: putMCPServer
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: "Lower-case letters, digits, '_' and '-', at most 40; not skopos. Runs see its tools as mcp__<name>__…" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerDef" }
      responses:
        "200":
          description: Saved, with the state of its secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerDef" }
        "400": { description: "Invalid definition: no URL or command, a credential written into it, an unknown field" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
    delete:
      summary: Remove an MCP server definition and its stored secrets (admin key that reaches every workspace)
      description: Refused with 409 while a stored config gives its runs the server, unless `force=1`. Audited as `mcp_server.delete`.
      operationId: deleteMCPServer
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: force, in: query, required: false, schema: { type: string, enum: ["1", "true"] } }
      responses:
        "204": { description: Removed }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
        "404": { description: Not defined }
        "409": { description: A stored config gives its runs the server }

  /api/fleet/mcp-servers/{name}/secrets/{secret}:
    put:
      summary: Store the value of a secret an MCP server's definition names (admin key that reaches every workspace)
      description: >-
        The value is sealed under the server's secret key
        (`integrations.secret_key`) and never returned by any endpoint: it
        leaves the server only inside the answer to a claim, for a run of a
        workspace whose config names the server. At least 8 characters, one
        line. Audited as `mcp_server.secret_set`, with the secret's name only.
      operationId: setMCPSecret
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: secret, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        "204": { description: Stored }
        "400": { description: The definition names no such secret, or the value is too short }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
        "404": { description: The server is not defined }
        "409": { description: The server has no secret key }
    delete:
      summary: Delete a stored secret (admin key that reaches every workspace)
      description: Runs go without the server until the secret is set again. Audited as `mcp_server.secret_unset`.
      operationId: unsetMCPSecret
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: secret, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
        "404": { description: The server is not defined, or the secret is not set }

  /api/fleet/secret-key:
    get:
      summary: Which key sealed the stored secrets (root key)
      description: Key ids are fingerprints; they say nothing about a key.
      operationId: getSecretKeyStatus
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The keys the server holds and what each sealed
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: string, description: The id of the key new values are sealed under; empty when the server has no secret key }
                  previous: { type: array, items: { type: string }, description: The ids of the other keys the server holds (integrations.previous_secret_key) }
                  sealed: { type: object, additionalProperties: { type: integer }, description: "Stored values by the key that sealed them; unnamed = from before keys were named" }
                  pending: { type: integer, description: How many values a rotation would seal again }
                  unreadable: { type: integer, description: Values under a key the server does not hold }
        "401": { description: Unauthorized }
        "403": { description: Requires the root key }

  /api/fleet/secret-key/rotate:
    post:
      summary: Seal every stored secret again under the server's current key (root key)
      description: >-
        MCP server credentials and webhook signing secrets, all of them or
        none. To change the secret key: set the new key as
        `integrations.secret_key` and the old one as
        `integrations.previous_secret_key`, restart, call this, then remove
        the previous key. The keys themselves are never sent. Audited as
        `secret_key.rotate`.
      operationId: rotateSecretKey
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: string }
                  resealed: { type: integer }
        "401": { description: Unauthorized }
        "403": { description: Requires the root key }
        "409": { description: The server has no secret key, or a stored value is under a key it does not hold (nothing was changed) }

  /api/fleet/wrappers:
    get:
      summary: List the wrapper definitions (any key)
      operationId: listWrapperDefs
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The definitions with their revisions and the executor id their runs record
          content:
            application/json:
              schema:
                type: object
                properties:
                  wrappers:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/WrapperDef" }
                        - type: object
                          properties:
                            executor: { type: string, description: "wrapper:<name>:<hash of the argv>" }
                            rev: { type: string }
                            updated_at: { type: string, format: date-time }
                            updated_by: { type: string }
                            used_by: { type: array, items: { type: string }, description: "The owners (workspace:<id>, group:<id>) whose stage blocks name it. Only for an admin key that reaches every workspace" }
        "401": { description: Unauthorized }

  /api/fleet/wrappers/{name}:
    put:
      summary: Define or redefine a wrapper (admin key that reaches every workspace)
      description: >-
        A wrapper is the argv prefix a run starts behind: the agent, and the
        worker's setup and check commands of the stage. A stage block of a
        workspace's or group's config attaches it by rule (`stages.<stage>.wrap`).
        The worker fills in `{dir}`, `{gitdir}`, `{login}`, `{rundir}`,
        `{cli}`, `{run}`, `{stage}`, `{workspace}` for each run and `${NAME}`
        from its own `worker.vars`. Only a worker with `server_commands` runs
        it. `check` is a command that shows the wrapper can start on a host: a
        worker where it fails takes no run the wrapper is for. An argv that
        only sets variables (`env K=V`) is refused. Audited as
        `wrapper.create` / `wrapper.update`, with the argv.
      operationId: putWrapperDef
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: "Lower-case letters, digits, '.', '_' and '-', at most 40" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WrapperDef" }
      responses:
        "200":
          description: Saved, with the executor id its runs record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WrapperDef" }
        "400": { description: "Invalid definition: no argv, an unknown placeholder, an argv that only sets variables, an unknown field" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
    delete:
      summary: Remove a wrapper definition (admin key that reaches every workspace)
      description: Refused with 409 while a stored stage block names the wrapper, unless `force=1`. A run whose rule names a wrapper that is not defined is not started. Audited as `wrapper.delete`.
      operationId: deleteWrapperDef
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: force, in: query, required: false, schema: { type: string, enum: ["1", "true"] } }
      responses:
        "204": { description: Removed }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
        "404": { description: Not defined }
        "409": { description: A stored stage block names the wrapper }

  /api/fleet/runners:
    get:
      summary: List the runner definitions (any key)
      operationId: listRunnerDefs
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The definitions with their revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  runners:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/RunnerDef" }
                        - type: object
                          properties:
                            rev: { type: string }
                            updated_at: { type: string, format: date-time }
                            updated_by: { type: string }
        "401": { description: Unauthorized }

  /api/fleet/runners/{name}:
    put:
      summary: Define or redefine a runner (admin key that reaches every workspace)
      description: >-
        One definition per runner name, for every worker: the CLI, the model,
        the effort and the declared provider. A worker offers it when one of
        its accounts is a login for that kind (`kind = "claude"` on the
        account) and its endpoint does not contradict the declared provider.
        A `command` runner cannot be defined here: its argv runs on the
        worker's host. Audited as `runner_def.create` / `runner_def.update`.
      operationId: putRunnerDef
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunnerDef" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerDef" }
        "400": { description: "Invalid definition: an unknown kind, an effort the CLI does not take, a provider the model contradicts" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
    delete:
      summary: Remove a runner definition (admin key that reaches every workspace)
      description: Workers then offer the name only when their own file defines it. Audited as `runner_def.delete`.
      operationId: deleteRunnerDef
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }
        "404": { description: Not defined }

  /api/config/export:
    get:
      summary: Everything about how runs are configured, as one document (admin key that reaches every workspace)
      description: Runner definitions, the fleet's policies, every group with its members, and each group's and workspace's policy, pipeline and config. `skopos config export` writes it as TOML.
      operationId: exportConfig
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigDocument" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission over every workspace }

  /api/config/apply:
    post:
      summary: Make the server match a configuration document, or list what that would change (admin key)
      description: >-
        The document is authoritative for what it lists: a workspace or group
        in it gets exactly the policy, pipeline and config it gives (a section
        left out is cleared); `fleet` and `runners`, when present, state the
        fleet's policies and the full set of runner definitions. What it does
        not list is left as it is and named in `unlisted` (cut to the
        caller's scope). Every change is checked first against the server's
        current state (permission, validation, conflicts, what a policy
        strands) and nothing is written unless all pass; the settings of an
        owner the same document creates, and a pipeline the current policy
        refuses while the document changes a policy, are decided when
        applied and carry a warning in the plan. Each change needs the
        permission its own save needs (root for a group's members and
        pipeline, approver for a workspace's pipeline); a section left as
        it is needs none. A field the document schema does not have is
        refused. With `plan` nothing is written. An apply is audited as `config.apply` with
        the file's hash and commit, and each change inside it by its own
        action with the surface `apply`.
      operationId: applyConfig
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { $ref: "#/components/schemas/ConfigDocument" }
                file_hash: { type: string, description: sha256 of the file the document was read from }
                commit: { type: string, description: The git commit the file comes from }
                force: { type: boolean, description: Save policies that strand configured runners }
                plan: { type: boolean, description: List the changes and make none }
      responses:
        "200":
          description: The changes made, or with plan the changes an apply would make
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [runner, workspace, group, policy, pipeline, config] }
                        owner: { type: string, description: "fleet:ceiling, fleet:default, group:<name>, workspace:<id> or runner:<name>" }
                        action: { type: string, enum: [create, update, clear, delete] }
                        detail: { type: string }
                        revision: { type: string, description: The revision the apply created }
                        warnings: { type: array, items: { type: string } }
                  unlisted: { type: array, items: { type: string }, description: Groups and workspaces with settings on the server that the document does not list }
                  file_hash: { type: string }
                  commit: { type: string }
        "400": { description: Invalid document or section }
        "401": { description: Unauthorized }
        "403": { description: A change needs a permission the key does not hold }
        "404": { description: A group or workspace a change names is not found }
        "409": { description: "A change is refused as it stands: a policy that strands current settings (pass force), two groups setting the same thing, a runner the policy forbids" }

  /api/workspaces/{id}/policy:
    get:
      summary: A workspace's own runner policy (any key with the workspace in scope)
      operationId: getWorkspacePolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The policy at this level (policy null when none is set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Not found or out of scope }
    put:
      summary: Set a workspace's own runner policy (admin key with the workspace in scope)
      description: >-
        Replaces the policy at this level with the given allow rules, as a
        new revision. Refused with 409 when it would newly strand configured
        runners (a stage's runner that workers offer but none would be
        allowed to run) or drop a workspace's embedded code index, unless
        force is true. Audited as `policy.set` with the old and new revision.
      operationId: putWorkspacePolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: Saved (warnings lists what a forced save stranded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "400": { description: "Invalid policy: no rules, an unknown stage or kind" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Not found or out of scope }
        "409": { description: The policy would strand current settings; the message lists them. Save with force }
    delete:
      summary: Remove a workspace's own runner policy (admin key with the workspace in scope)
      description: The revisions stay; what then applies may be narrower (the fleet default instead of a workspace's own). `?force=true` as for PUT. Audited as `policy.delete`.
      operationId: deleteWorkspacePolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Not found or out of scope }
        "409": { description: Clearing would strand current settings; pass force=true }

  /api/workspaces/{id}/policy/effective:
    get:
      summary: Every runner policy that applies to a workspace, and where each comes from
      description: >-
        The fleet ceiling, then the workspace's groups' and its own policies —
        or the fleet default when it has none of those. A runner must be
        allowed by every layer. No layers means no policy: every runner is
        allowed.
      operationId: getEffectivePolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The effective policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectivePolicy" }
        "401": { description: Unauthorized }
        "404": { description: Not found or out of scope }

  /api/groups/{id}/policy:
    get:
      summary: A group's runner policy (admin key that reaches every workspace in the group)
      operationId: getGroupPolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The policy at this level (policy null when none is set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Unknown group }
    put:
      summary: Set a group's runner policy (admin key that reaches every workspace in the group)
      description: >-
        Replaces the policy at this level with the given allow rules, as a
        new revision. Refused with 409 when it would newly strand configured
        runners (a stage's runner that workers offer but none would be
        allowed to run) or drop a workspace's embedded code index, unless
        force is true. Audited as `policy.set` with the old and new revision.
      operationId: putGroupPolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: Saved (warnings lists what a forced save stranded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "400": { description: "Invalid policy: no rules, an unknown stage or kind" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Unknown group }
        "409": { description: The policy would strand current settings; the message lists them. Save with force }
    delete:
      summary: Remove a group's runner policy (admin key that reaches every workspace in the group)
      description: The revisions stay; what then applies may be narrower (the fleet default instead of a workspace's own). `?force=true` as for PUT. Audited as `policy.delete`.
      operationId: deleteGroupPolicy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "401": { description: Unauthorized }
        "403": { description: Requires the admin permission at this level }
        "404": { description: Unknown group }
        "409": { description: Clearing would strand current settings; pass force=true }

  /api/groups/{id}:
    get:
      summary: Get a workspace group (root only)
      operationId: getWorkspaceGroup
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
        "404": { description: Unknown group }
    patch:
      summary: Edit a group's fields; omitted lists stay unchanged (root only)
      description: Member or pattern changes terminate the SSE streams of every key holding the group.
      operationId: updateWorkspaceGroup
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
        "404": { description: Unknown group }
        "409": { description: Group name already exists }
    delete:
      summary: Delete a group (root only); keys holding it lose that slice of scope
      operationId: deleteWorkspaceGroup
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
        "404": { description: Unknown group }

  /api/workspaces/{id}/groups:
    get:
      summary: Groups holding the workspace as an explicit member (root only)
      operationId: workspaceGroups
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { description: Unauthorized }
        "403": { description: Root key required }
    put:
      summary: Replace the workspace's group allocations (root only)
      description: Names or ids; keys in any touched group re-evaluate their SSE scope.
      operationId: setWorkspaceGroups
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groups: { type: array, items: { type: string } }
      responses:
        "200":
          description: The workspace's groups after the change
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "400": { description: Unknown workspace or group, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: Root key required }

  /api/plans/{id}/amend:
    post:
      summary: Atomic amendment — append amended steps and snapshot a new revision past the lock (executor path)
      description: Guarded by the amendment guard (the linked item implementing or awaiting_approval); appends items and snapshots the new revision in one transaction. The worker then pauses its run; Martin's approve resumes it.
      operationId: amendPlan
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                base_sha: { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
      responses:
        "200":
          description: The new revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRevision" }
        "400": { description: No locked revision / invalid steps }
        "401": { description: Unauthorized }
        "403": { description: Guard refused (item not amending) }
        "404": { description: Unknown plan }
        "409": { description: Locked (guard) }

  /api/plans/{id}/candidates:
    post:
      summary: One planner's candidate in a multi-agent plan round (executor path)
      description: >-
        Snapshots an open candidate revision WITHOUT touching the plan's live
        steps. The approver picks one at the gate (approve with its
        revision_id); approving materialises it as the plan, locks it and
        supersedes its siblings. Guarded like replan (item in planning, plan
        unlocked).
      operationId: createPlanCandidate
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, steps]
              properties:
                group_id: { type: string, description: The plan group (run_groups) this candidate belongs to }
                label: { type: string, description: 'Its planner: "runner" or "focus@runner"' }
                base_sha: { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
                skills:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: The candidate revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRevision" }
        "400": { description: Invalid input }
        "401": { description: Unauthorized }
        "404": { description: Plan not found }
        "409": { description: Plan locked or not being planned }

  /api/plans/{id}/replan:
    post:
      summary: Atomic re-plan — replace all non-review steps and snapshot (executor path)
      description: Guarded by the planning guard (the linked item in planning); requires an unlocked latest revision. The FIRST plan and every re-plan both go through this call.
      operationId: replanPlan
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                base_sha: { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string }
                      description: { type: string }
                skills:
                  type: array
                  maxItems: 20
                  description: Repo skills (.skopos/skills/<name>) the plan selected — stored on the plan and the revision, covered by content_hash, so the approval binds them
                  items: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
      responses:
        "200":
          description: The new revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRevision" }
        "400": { description: Invalid steps }
        "401": { description: Unauthorized }
        "404": { description: Unknown plan }
        "409": { description: Revision locked or item not planning }

  /api/workspaces:
    post:
      summary: Register a workspace (upserts the display name)
      operationId: createWorkspace
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceCreateInput" }
      responses:
        "201":
          description: Workspace registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "200":
          description: Existing workspace renamed (upsert)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
    get:
      summary: List registered workspaces
      operationId: listWorkspaces
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
  # ---- code index ----
  /api/codeindex/{workspace}/manifest:
    post:
      summary: Negotiate which file hashes the server needs (index push, step 1)
      operationId: codeIndexManifest
      security: [{ BearerAuth: [] }]
      parameters: [{ name: workspace, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "{ missing: [hash] }" }
  /api/codeindex/{workspace}/blobs:
    post:
      summary: Upload parsed-file payloads as NDJSON (index push, step 2)
      operationId: codeIndexBlobs
      security: [{ BearerAuth: [] }]
      parameters: [{ name: workspace, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string }
      responses:
        "200": { description: "{ stored, skipped }" }
        "415": { description: Content type must be application/x-ndjson }
  /api/codeindex/{workspace}/commit:
    post:
      summary: Atomically point a branch at a file set (index push, step 3)
      operationId: codeIndexCommit
      security: [{ BearerAuth: [] }]
      parameters: [{ name: workspace, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Committed }
  /api/codeindex/{workspace}/status:
    get:
      summary: List indexed branches (HEAD, freshness, source)
      operationId: codeIndexStatus
      security: [{ BearerAuth: [] }]
      parameters: [{ name: workspace, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Branch status array }
  /api/codeindex/{workspace}/search:
    get:
      summary: Full-text symbol search (camelCase split-tokenized; semantic=true fuses vectors when configured)
      operationId: codeIndexSearch
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string }, description: Path prefix filter }
        - { name: branch, in: query, schema: { type: string } }
        - { name: semantic, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: Symbol hits with branch/fallback labeling; hits carry doc, modifiers, and attributes }
  /api/codeindex/{workspace}/symbol:
    get:
      summary: Exact-name symbol definitions
      operationId: codeIndexSymbol
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string }, description: Path prefix filter }
        - { name: path, in: query, schema: { type: string }, description: Path prefix filter }
        - { name: path, in: query, schema: { type: string }, description: Path prefix filter }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200": { description: Symbol hits with the full definition card — doc comment (summary + non-signature tags; declaration data always wins over stale doc tags), modifiers, attributes }
  /api/codeindex/{workspace}/outline:
    get:
      summary: A file's definitions in source order
      operationId: codeIndexOutline
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200": { description: Symbol hits }
  /api/codeindex/{workspace}/callers:
    get:
      summary: Call sites of a symbol (heuristic, name-based)
      operationId: codeIndexCallers
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200": { description: Edge hits }
  /api/codeindex/{workspace}/callees:
    get:
      summary: What a symbol calls
      operationId: codeIndexCallees
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200": { description: Edge hits }
  /api/codeindex/{workspace}/impact:
    get:
      summary: Transitive callers of a symbol (what a change affects)
      operationId: codeIndexImpact
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer } }
      responses:
        "200": { description: Affected symbols by BFS depth }
  /api/codeindex/{workspace}/dead:
    get:
      summary: Symbols with no incoming call references (heuristic candidates)
      operationId: codeIndexDead
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200": { description: Dead-code candidates, carrying doc/modifiers/attributes }
  /api/codeindex/{workspace}/cycles:
    get:
      summary: Cycles in the call graph
      operationId: codeIndexCycles
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200": { description: Call cycles }
  /api/codeindex/{workspace}/call-tree:
    get:
      summary: Recursive callee tree of a symbol
      operationId: codeIndexCallTree
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer } }
      responses:
        "200": { description: Call tree }
  /api/codeindex/{workspace}/dependencies:
    get:
      summary: Per-file import dependencies (module graph)
      operationId: codeIndexDependencies
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string }, description: Path prefix filter }
      responses:
        "200": { description: File-to-imports mapping }
  /api/codeindex/{workspace}/branch-diff:
    get:
      summary: Symbol/file deltas of a branch vs the default branch
      operationId: codeIndexBranchDiff
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: branch, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Branch diff }
  /api/codeindex/{workspace}/refresh:
    post:
      summary: "Server-side: clone/pull the workspace git_url and rebuild (async)"
      operationId: codeIndexRefresh
      security: [{ BearerAuth: [] }]
      parameters: [{ name: workspace, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: Refresh started }
    get:
      summary: "Server-side refresh state"
      operationId: codeIndexRefreshStatus
      security: [{ BearerAuth: [] }]
      parameters: [{ name: workspace, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Refresh state }
  /api/codeindex/{workspace}:
    delete:
      summary: Drop a workspace's entire index (index DB and vectors in any backend)
      operationId: codeIndexDropWorkspace
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Dropped }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Unknown workspace }
  /api/codeindex/{workspace}/branch/{branch}:
    delete:
      summary: Drop a branch's index state
      operationId: codeIndexDropBranch
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string } }
        - { name: branch, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Dropped }
  /api/workspaces/{id}:
    delete:
      summary: Unregister a workspace (does not delete its sessions/entries/plans)
      operationId: deleteWorkspace
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/workspaces/{id}/pipeline:
    get:
      summary: Effective pipeline settings of a workspace — which agents run each stage, with where each comes from (the workspace or a group)
      operationId: getWorkspacePipeline
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pipeline settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineView" }
        "401": { description: Unauthorized }
        "403": { description: Out of scope }
        "404": { description: Not found or out of scope }
    put:
      summary: Set a workspace's own pipeline settings (approver keys whose scope covers it)
      description: >-
        Replaces the whole document at this level: stages it omits are
        cleared here (the workspace then inherits its group's). Audit-logged with what changed. Applies
        from the next queued stage.
      operationId: putWorkspacePipeline
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineSettingsInput" }
      responses:
        "200":
          description: Saved; the new view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineView" }
        "400": { description: Invalid settings (unknown stage, a list on a single-runner stage, bad focus or policy) }
        "409": { description: "The save newly names a runner the server defines whose declared provider and model the workspace's runner policy allows on no worker; the message names the runner, the stage and the policy" }
        "401": { description: Unauthorized }
        "403": { description: Requires the approver permission and the workspace in scope }
        "404": { description: Not found or out of scope }

  # ---- blackboard ----
  /api/blackboard/entries:
    post:
      summary: Write a blackboard entry
      operationId: blackboardWrite
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlackboardWriteInput" }
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlackboardWriteResult" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
    get:
      summary: Read the knowledge bundle (entries + markdown), or search when q/entry_type/author is present
      operationId: blackboardRead
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: q, in: query, description: "Text search (matches title or content); presence of this, entry_type, or author switches to search mode", schema: { type: string } }
        - { name: entry_type, in: query, description: "Filter by type: finding, decision, bug, debt, warning, context", schema: { type: string } }
        - { name: author, in: query, description: Filter by author agent ID, schema: { type: string } }
      responses:
        "200":
          description: Knowledge bundle, or `{ entries, total }` search results when a search filter is present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlackboardBundle" }
    delete:
      summary: Bulk-delete every entry of one type in one workspace (all scopes and branches)
      operationId: blackboardPurgeType
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, required: true, schema: { type: string }, description: Workspace to purge (required for every principal, root included) }
        - { name: entry_type, in: query, required: true, schema: { type: string }, description: "One of: finding, decision, bug, debt, warning, context" }
      responses:
        "200":
          description: "Purge result: { deleted: N }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "400": { description: "Missing or invalid workspace_id / entry_type" }
        "401": { description: Unauthorized }
        "403": { description: Workspace out of scope for this credential }
  /api/blackboard/entries/{id}/promote:
    patch:
      summary: Promote an entry to a wider scope (session -> branch -> project)
      operationId: blackboardPromote
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
      responses:
        "204": { description: Promoted }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Entry not found }
        "409": { description: Already at project scope }
  /api/blackboard/entries/{id}:
    delete:
      summary: Delete a blackboard entry
      operationId: blackboardDelete
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/EntryId" }
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Entry not found }

  # ---- plans ----
  /api/plans:
    post:
      summary: Create a plan
      operationId: createPlan
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanInput" }
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
    get:
      summary: List plans
      operationId: listPlans
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }
  /api/plans/{id}:
    get:
      summary: Get a plan with all items and dependencies
      operationId: getPlan
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { description: Plan not found }
    patch:
      summary: Update a plan (name, description, status)
      operationId: updatePlan
