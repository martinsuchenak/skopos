      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlanInput" }
      responses:
        "204": { description: Updated }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Plan not found }
    delete:
      summary: Delete a plan (cascades to items and dependencies)
      operationId: deletePlan
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
