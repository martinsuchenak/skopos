components:
  parameters:
    SessionId:  { name: id, in: path, required: true, schema: { type: string } }
    EntryId:    { name: id, in: path, required: true, schema: { type: string } }
    PlanId:     { name: id, in: path, required: true, schema: { type: string } }
    ItemId:     { name: item_id, in: path, required: true, schema: { type: string } }
    InboxItemId: { name: id, in: path, required: true, schema: { type: string } }
    RunId:       { name: id, in: path, required: true, schema: { type: string } }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Send an API key as the bearer token: the root key (server config, full
        access and exclusive key/workspace management) or a scoped key minted
        via POST /api/keys. Scoped keys are limited to their workspace list —
        explicit-workspace operations outside the scope return 403 (listing
        the accessible workspaces), by-id operations return 404, and writes
        require workspace_id for every principal including root.
  schemas:
    WorkerPause:
      type: object
      description: A pause in force on a worker
      properties:
        at: { type: string, format: date-time }
        until: { type: string, format: date-time, description: When it ends; absent = until resumed }
        by: { type: string, description: "Who paused it: root, key <name>" }
        reason: { type: string }
    Answers:
      description: |
        Answers to the item's open questions: a list by question id, or free text. Free text is read
        line by line against the open questions: "1) a", "1. b — words" or "2) Redis" link to question
        n of the open set (with several open sets, "<label> 1) a" or a "To <label>:" line picks the
        set); a letter is an option when the question has one. The rest is a general answer to the
        set. The action's response lists what was matched (answers_matched).
      oneOf:
        - type: string
        - type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id: { type: string }
              option: { type: string, description: The option's letter (a, b, c…) }
              text: { type: string }
              replaces: { type: string, description: "A correction: the id of the question's current answer it replaces" }
    QuestionRow:
      type: object
      properties:
        kind: { type: string, enum: [question, free] }
        workspace_id: { type: string }
        item_id: { type: string }
        item_title: { type: string, description: Empty when the item was deleted }
        set_id: { type: string }
        asker: { type: string }
        label: { type: string }
        run_id: { type: string }
        subject_kind: { type: string }
        subject: { type: string }
        blocking: { type: boolean }
        question_id: { type: string }
        n: { type: integer }
        question: { type: string }
        state: { type: string }
        asked_at: { type: string, format: date-time }
        answer_id: { type: string }
        option: { type: string }
        option_text: { type: string }
        answer: { type: string, description: The current answer's words, or the free text }
        answered_by: { type: string }
        via: { type: string }
        action: { type: string }
        approval_id: { type: string }
        answered_at: { type: string, format: date-time }
        used_by_run: { type: string }
        corrections: { type: integer }
        after_use: { type: boolean }
        waited_seconds: { type: integer, description: "From asked to the first answer or skip; only for questions asked and answered live" }
    QuestionCounts:
      type: object
      properties:
        asked: { type: integer }
        answered: { type: integer }
        answered_free_text: { type: integer }
        skipped: { type: integer }
        open: { type: integer }
        superseded: { type: integer }
        free_answers: { type: integer }
        corrections: { type: integer }
        corrections_after_use: { type: integer }
        median_wait_seconds: { type: integer, description: "Over the questions asked and answered live (imports carry no wait)" }
        measured: { type: integer, description: How many waits the median is over }
    QuestionSet:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        item_id: { type: string }
        asker: { type: string, enum: [planner, implementer, worker] }
        stage: { type: string }
        run_id: { type: string }
        runner: { type: string }
        label: { type: string, description: A plan candidate's label }
        subject_kind: { type: string, enum: [plan_revision, base, head, none] }
        subject: { type: string }
        blocking: { type: boolean }
        source: { type: string, enum: [worker, imported] }
        open: { type: boolean, description: A question of the set is still open }
        created_at: { type: string, format: date-time }
        general: { type: array, items: { $ref: "#/components/schemas/Answer" }, description: Free-text answers to the set as a whole }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              set_id: { type: string }
              n: { type: integer, description: The number steps cite }
              text: { type: string }
              options: { type: array, items: { type: string } }
              state: { type: string, enum: [open, answered, answered_free_text, skipped, superseded] }
              answers: { type: array, items: { $ref: "#/components/schemas/Answer" } }
    Answer:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [answer, general, skipped] }
        question_id: { type: string }
        set_id: { type: string }
        option: { type: string }
        text: { type: string }
        replaces: { type: string }
        action: { type: string, enum: [approve, request_changes, retry, answer, imported] }
        approval_id: { type: string }
        actor: { type: string }
        actor_key_id: { type: string }
        via: { type: string, enum: [dashboard, slack, cli, mcp, api, worker, migration] }
        used_by_run: { type: string, description: The first run whose prompt carried it }
        replaced: { type: boolean, description: A later correction replaces it }
        after_use: { type: boolean, description: "A correction of an answer a run had already used" }
        created_at: { type: string, format: date-time }
    PipelineStage:
      type: object
      required: [members]
      properties:
        members:
          type: array
          minItems: 1
          description: Several only on plan, review and qa
          items:
            type: object
            required: [runner]
            properties:
              runner: { type: string }
              focus: { type: string, description: "Focus brief name (.skopos/focus/<name>.md)" }
        policy: { type: string, enum: [any-blocks, majority, all-pass], description: review/qa only }
        early_exit: { type: boolean, description: review/qa only }
        timeout_ms: { type: integer, description: "plan/review/qa with several agents; at least 60000" }
    PipelineSettingsInput:
      type: object
      properties:
        stages:
          type: object
          description: "Keyed by stage: plan, compare, synthesize, implement, review, qa"
          additionalProperties: { $ref: "#/components/schemas/PipelineStage" }
        agents_default: { type: string, enum: [panel, solo, default, ""], description: What items without their own switch get }
        second_opinion_runner: { type: string, description: "Default runner for second opinions; none or empty clears it" }
        code_index: { type: boolean, description: "Workspaces only (groups refuse it): idle workers keep the workspace's code index fresh. The document is replaced whole — send it on every save." }
        via: { type: string, description: Surface label for the audit log }
    PipelineView:
      type: object
      properties:
        owner_kind: { type: string, enum: [workspace, group] }
        owner_id: { type: string }
        own:
          type: object
          properties:
            stages: { type: object, additionalProperties: { $ref: "#/components/schemas/PipelineStage" } }
            agents_default: { type: string }
            second_opinion_runner: { type: string }
            code_index: { type: boolean }
        indexable_by: { type: array, items: { type: string }, description: "Workspace only: workers whose recent claims say they can fetch and index this repo" }
        effective:
          type: object
          description: "Workspace only: the resolved stages, each with source (workspace or group:<name>)"
          additionalProperties:
            allOf:
              - { $ref: "#/components/schemas/PipelineStage" }
              - type: object
                properties:
                  source: { type: string }
        effective_agents_default: { type: string }
        effective_second_opinion_runner: { type: string }
        second_opinion_source: { type: string }
        agents_default_source: { type: string }
        groups:
          type: array
          items: { type: object, properties: { id: { type: string }, name: { type: string } } }
        conflicts: { type: array, items: { type: string }, description: Stages two groups both set (the first group by name wins until fixed) }
        unknown_runners: { type: array, items: { type: string }, description: Runners no worker serving this workspace offers yet }
        policy: { $ref: "#/components/schemas/EffectivePolicy" }
        policy_refused: { type: array, items: { type: string }, description: "Workspace only: configured runners the policy allows on no worker that offers them — their runs would wait" }
    WorkspaceConfig:
      type: object
      description: "The shared part of a workspace's configuration. A field left out is not set at this level; an empty list is set, to nothing. Durations are text (\"90s\", \"10m\")."
      properties:
        default_branch: { type: string, description: Default main }
        branch_prefix: { type: string, description: Default agent/ }
        branch_template: { type: string, description: "An item branch's name: {prefix}, {tail}, {slug}, {ref}; needs {tail} or {ref}" }
        checkout: { type: string, enum: [worktree, branch] }
        protected_branches: { type: array, items: { type: string } }
        setup: { type: array, items: { type: string }, description: Commands run in every fresh worktree. A command field }
        checks: { type: array, items: { type: string }, description: Verification commands run after an implementation. A command field }
        check_fix_rounds: { type: integer, minimum: 0, maximum: 5 }
        preflight: { type: array, items: { type: string }, description: Commands that say whether a worker can take the repository's work. A command field }
        preflight_interval: { type: string }
        setup_timeout: { type: string }
        check_timeout: { type: string }
        quiet_timeout: { type: string, description: "Stops a setup or check command that prints nothing for this long; 0s = off" }
        plan_timeout: { type: string }
        impl_timeout: { type: string }
        push:
          type: object
          properties:
            kind: { type: string, enum: [github, gitea, none] }
            remote_url: { type: string, description: "An http(s) push URL without credentials: the token comes from the worker's environment" }
            pull_request: { type: string, enum: [draft, ready, none] }
            steps: { type: boolean, description: Push the implementer's commits as they are made }
        mcp_deny: { type: array, items: { type: string }, description: MCP tools runs may not use }
        mcp_servers: { type: array, items: { type: string }, description: "MCP tool prefixes runs may use (mcp__<server>…)" }
        mcp: { type: array, items: { type: string }, description: "The MCP server definitions the workspace's runs get. Set (an empty list too), the server holds the runs' MCP servers: each run gets exactly these with its claim, and a worker's own mcp_config is not used for the workspace. Each needs an entry in mcp_servers that allows its tools. Left out at every level: each worker's mcp_config applies" }
        stages:
          type: object
          description: "What each stage's agent is given and which wrapper its runs start behind, by stage (plan, implement, review, qa; a second opinion and a branch review run as a review). Each stage's block is one field (stages.implement): a workspace's block replaces its group's whole. Command fields: a worker takes them only with server_commands, and gives a stage what its block says only where something contains the run"
          additionalProperties: { $ref: "#/components/schemas/StageCaps" }
    StageCaps:
      type: object
      description: One stage's block. An empty block sets the stage to nothing
      properties:
        tools: { type: array, items: { type: string }, description: "Extra allowed tools, e.g. Bash(npm run:*)" }
        env:
          type: object
          additionalProperties: { type: string }
          description: "Extra variables for the repository's tools. ${NAME} is filled in from the worker's worker.vars. Refused: proxy and endpoint variables, variables that configure the agent CLI or its provider (ANTHROPIC_, CLAUDE_, OPENAI_, OPENCODE_, CODEX_, GEMINI_, GOOGLE_, VERTEX_, AWS_, AZURE_), the login variables (HOME, CLAUDE_CONFIG_DIR, CODEX_HOME, XDG_*_HOME), credential-looking names (TOKEN, SECRET, PASSWORD, _KEY) and loader variables (LD_*, DYLD_*, NODE_OPTIONS, …). A variable of the runner's account on the worker wins over it"
        settings:
          description: "Merged into the agent's settings: permissions (allow, deny, additionalDirectories) and sandbox, nothing else. An object, or a string holding that JSON; answers carry the object"
          oneOf:
            - { type: object }
            - { type: string }
        wrap:
          type: array
          description: Which wrapper goes around the stage's runs. The first rule that matches the runner decides
          items:
            type: object
            required: [wrapper]
            properties:
              kind: { type: string, description: "The runner's kind (claude, opencode, codex, …)" }
              provider: { type: string, description: A glob on the runner's provider }
              model: { type: string, description: A glob on the runner's model }
              runner: { type: string, description: A glob on the runner's name }
              wrapper: { type: string, description: "A wrapper definition's name, or none to leave the matched runs unwrapped" }
    MCPServerDef:
      type: object
      required: [type]
      properties:
        name: { type: string }
        type: { type: string, enum: [http, command] }
        url: { type: string, description: "http: the server's URL. ${secret:NAME} names a secret" }
        headers: { type: object, additionalProperties: { type: string }, description: "http: request headers. A credential is ${secret:NAME}" }
        command: { type: array, items: { type: string }, description: "command: the argv the worker runs (only on workers with server_commands). ${NAME} is filled in from the worker's worker.vars; no secrets" }
        env: { type: object, additionalProperties: { type: string }, description: "command: the server's environment. A credential is ${secret:NAME}; ${NAME} is the worker's" }
        workspaces: { type: array, items: { type: string }, description: "The workspaces whose runs may be given the server, as patterns on the workspace id (a * stops at a slash; \"*\" alone is every workspace). Required when the definition names secrets; left out on a server without secrets = any workspace. Checked when a config names the server and again when a run is claimed" }
    RunMCP:
      type: object
      description: "Only in the claim answer: the MCP servers of the run's agent, for the run's workspace, with their credentials. Never stored or returned by another endpoint"
      properties:
        servers: { type: object, additionalProperties: { type: object }, description: "By name, in the mcpServers shape agent CLIs read, the secrets filled in" }
        secrets: { type: array, items: { type: string }, description: The secret values inside servers, for the worker to keep out of the run's log }
        notes: { type: array, items: { type: string }, description: "Servers the workspace's config names and this run does not get, with why (a secret that is not set, a command server for a worker without server_commands)" }
        unreadable: { type: boolean, description: The servers could not be resolved; the worker gives the run back }
    WrapperDef:
      type: object
      required: [argv]
      properties:
        name: { type: string }
        argv: { type: array, items: { type: string }, description: "The command a run starts behind, with {dir} {gitdir} {login} {rundir} {cli} {run} {stage} {workspace} and ${NAME} from the worker's worker.vars" }
        check: { type: array, items: { type: string }, description: "A command that shows the wrapper can start on a host (no run placeholders). It does not show that the wrapper isolates" }
        executor: { type: string, readOnly: true, description: "wrapper:<name>:<hash of the argv>: what runs inside it record" }
    ConfigInput:
      type: object
      required: [config]
      properties:
        config: { $ref: "#/components/schemas/WorkspaceConfig" }
        note: { type: string, description: Kept with the revision }
        if_rev: { type: string, description: "Save only when the stored revision is still this one (empty = none stored); otherwise 409. For a read-modify-write" }
    EffectiveConfig:
      type: object
      properties:
        workspace: { type: string }
        managed: { type: boolean, description: The workspace has a config of its own on the server }
        rev: { type: string, description: "Names this combination of stored revisions; runs record it as config_rev" }
        config: { $ref: "#/components/schemas/WorkspaceConfig" }
        sources: { type: object, additionalProperties: { type: string }, description: "Per field (push.kind for a push field): workspace or group:<name>" }
        parts:
          type: array
          description: The stored revisions that make it up, in the order they apply
          items:
            type: object
            properties:
              owner: { type: string }
              revision: { type: string }
              source: { type: string }
        conflicts: { type: array, items: { type: string }, description: Fields two of the workspace's groups both set; the first group by name keeps the field }
    ConfigView:
      type: object
      properties:
        owner_kind: { type: string, enum: [workspace, group] }
        owner_id: { type: string }
        config:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WorkspaceConfig" }]
        rev: { type: string, description: The stored revision }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        via: { type: string }
        effective: { $ref: "#/components/schemas/EffectiveConfig" }
        changed: { type: array, items: { type: string }, description: The fields a save changed }
    RunnerDef:
      type: object
      required: [kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [claude, opencode, codex, antigravity] }
        model: { type: string, description: "opencode: <provider>/<model>" }
        effort: { type: string, description: Reasoning effort, as the CLI takes it }
        provider: { type: string, description: "The declared provider: what a runner policy matches" }
    ConfigDocument:
      type: object
      description: The file form of the run configuration (skopos config export / apply)
      properties:
        fleet:
          type: object
          description: When present, states both fleet policies; one left out is cleared
          properties:
            ceiling: { $ref: "#/components/schemas/PolicyInput" }
            default: { $ref: "#/components/schemas/PolicyInput" }
        runners:
          type: object
          nullable: true
          description: When present (an object, even empty), the full set of runner definitions by name; null or left out leaves the server's
          additionalProperties: { $ref: "#/components/schemas/RunnerDef" }
        mcp:
          type: object
          nullable: true
          description: When present (an object, even empty), the full set of MCP server definitions by name; null or left out leaves the server's. Definitions name their secrets and never hold a value; stored values are kept for the secrets a definition still names
          additionalProperties: { $ref: "#/components/schemas/MCPServerDef" }
        wrappers:
          type: object
          nullable: true
          description: When present (an object, even empty), the full set of wrapper definitions by name; null or left out leaves the server's. A wrapper the document drops while a stage block outside the document still names it is refused unless the apply is forced
          additionalProperties: { $ref: "#/components/schemas/WrapperDef" }
        groups:
          type: object
          additionalProperties:
            type: object
            properties:
              description: { type: string }
              workspaces: { type: array, items: { type: string } }
              patterns: { type: array, items: { type: string } }
              policy: { $ref: "#/components/schemas/PolicyInput" }
              pipeline: { $ref: "#/components/schemas/ConfigDocumentPipeline" }
              config: { $ref: "#/components/schemas/WorkspaceConfig" }
        workspaces:
          type: object
          additionalProperties:
            type: object
            properties:
              policy: { $ref: "#/components/schemas/PolicyInput" }
              pipeline: { $ref: "#/components/schemas/ConfigDocumentPipeline" }
              config: { $ref: "#/components/schemas/WorkspaceConfig" }
    ConfigDocumentPipeline:
      type: object
      properties:
        stages:
          type: object
          additionalProperties:
            type: object
            required: [members]
            properties:
              members: { type: string, description: "[focus@]runner, comma-separated" }
              policy: { type: string, enum: [any-blocks, majority, all-pass] }
              early_exit: { type: boolean }
              timeout: { type: string }
        agents_default: { type: string, enum: [panel, solo] }
        second_opinion_runner: { type: string }
        code_index: { type: boolean }
    PolicyRule:
      type: object
      description: "Allows a runner when every field it sets matches what the worker reports about the runner. provider, model and runner are globs (* any run of characters, ? one), compared without regard to case. A rule that sets no provider matches any provider."
      properties:
        provider: { type: string, description: "Who receives the code: anthropic, openai, zai, google, aws, local, a name a runner declares, or unknown:<host>" }
        model: { type: string, description: "A glob on the model id, e.g. claude-opus-*" }
        kind: { type: string, enum: [claude, opencode, codex, antigravity, command], description: The agent CLI }
        runner: { type: string, description: A glob on the runner name }
        stages: { type: array, items: { type: string, enum: [plan, implement, review, qa, compare, synthesize, second_opinion, embeddings] }, description: "The stages the rule covers (default: all). embeddings is the code index's embeddings endpoint" }
        executor: { type: string, description: "What must contain the run: isolated (a stage wrapper, or a runner whose own lockdown is a sandbox), contained (either of those, or a worker whose host is a container), or a glob on the executor id that starts with a class, e.g. wrapper:bwrap:* or sandbox:*. Left out: any executor" }
    PolicyInput:
      type: object
      required: [allow]
      properties:
        allow: { type: array, items: { $ref: "#/components/schemas/PolicyRule" }, description: "A runner is allowed when at least one rule matches. At least one rule: clear the policy to remove it" }
        force: { type: boolean, description: Save although it strands configured runners or drops a workspace's embedded code index }
        via: { type: string }
    PolicyView:
      type: object
      properties:
        owner_kind: { type: string, enum: [fleet-ceiling, fleet-default, group, workspace] }
        owner_id: { type: string }
        policy:
          nullable: true
          type: object
          properties:
            allow: { type: array, items: { $ref: "#/components/schemas/PolicyRule" } }
        rev: { type: string, description: The revision that holds it }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        warnings: { type: array, items: { type: string }, description: What a forced save stranded }
    EffectivePolicy:
      type: object
      properties:
        workspace_id: { type: string }
        allow_all: { type: boolean, description: No policy applies }
        rev: { type: string, description: A hash of the layers' revisions; runs record it as policy_rev }
        layers:
          type: array
          items:
            type: object
            properties:
              source: { type: string, description: "fleet ceiling, fleet default, group <name> or workspace" }
              rev: { type: string }
              policy:
                type: object
                properties:
                  allow: { type: array, items: { $ref: "#/components/schemas/PolicyRule" } }
    RunnerFacts:
      type: object
      description: What a worker reports about one runner it has configured. A workspace's policy is matched against these at every claim.
      properties:
        name: { type: string }
        kind: { type: string, description: "The agent CLI: claude, opencode, codex, antigravity, command" }
        model: { type: string }
        effort: { type: string }
        provider: { type: string, description: "Who receives the code, declared on the runner or derived from the endpoint; unknown:<host> when it cannot be derived" }
        endpoint: { type: string, description: The host the CLI sends its requests to }
        stages: { type: array, items: { type: string }, description: "The stages it can run (a read-only runner lists every stage but implement); empty = all" }
    ExecutorFact:
      type: object
      description: "The executor a worker's runs get in one workspace, for a stage and a runner or for all of either when left out. The most specific entry applies: stage and runner, then stage, then runner, then neither."
      required: [executor]
      properties:
        stage: { type: string }
        runner: { type: string }
        executor: { type: string, description: "local, host:<name>, wrapper:<name>:<hash>, sandbox:<hash> or runner:<kind>; none:wrapper, none:uncontained or none:config where the worker cannot run the stage with the runner (no such run is handed to it)" }
    Error:
      type: object
      properties:
        error: { type: string }
    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Whoami:
      type: object
      properties:
        root: { type: boolean }
        key:
          nullable: true
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            all_workspaces: { type: boolean }
            approver: { type: boolean }
            delegate: { type: boolean }
            admin: { type: boolean }
            workspaces: { type: array, items: { type: string } }
            capabilities: { type: array, nullable: true, items: { type: string }, description: "null = full access. whoami answers every authenticated key, whatever its capabilities." }
        run:
          type: object
          description: "Present when the credential is a run's agent token (skr_…): the run it belongs to. key then describes the run's own identity (id run:<run id>, the run's workspace only, MCP only)."
          properties:
            id: { type: string }
            workspace_id: { type: string }
            item_id: { type: string }
            stage: { type: string }
            runner: { type: string }
            worker_id: { type: string }
        workspaces:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix: { type: string }
        all_workspaces: { type: boolean }
        approver: { type: boolean, description: May perform human-only workflow actions; root implies it }
        delegate: { type: boolean, description: "May name the person it acts for (X-Skopos-On-Behalf-Of)" }
        admin: { type: boolean, description: "May change policy and configuration within its scope; root implies it. Never for agent or worker keys" }
        capabilities:
          type: array
          nullable: true
          items: { type: string }
          description: "Key capabilities: surfaces (rest, mcp) and areas (code, blackboard, plans, inbox, status, runs, workspaces, events) as <area>:read|write. null = full access. A capped key gets 403 outside them (REST) and sees/calls only the MCP tools they cover."
        workspaces: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string }, description: Names of workspace groups the key holds }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    KeyReach:
      type: object
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        via:
          type: string
          description: '"explicit", "group:<name>" or "pattern:<group>:<pattern>"'

    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        members: { type: array, items: { type: string }, description: Explicit workspace ids }
        patterns: { type: array, items: { type: string }, description: "path.Match patterns; * matches one segment and never crosses /" }
        created_at: { type: string, format: date-time }

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        members: { type: array, items: { type: string } }
        patterns: { type: array, items: { type: string } }

    ApiKeyCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        workspaces:
          description: Exact workspace ids, or ["*"] for all workspaces; optional when groups are given
          type: array
          items: { type: string }
        groups:
          description: Workspace group names or ids; cannot be combined with "*"
          type: array
          items: { type: string }
        approver: { type: boolean, description: Grant the approver permission (human-only workflow actions) }
        delegate: { type: boolean, description: "Grant the delegate permission (X-Skopos-On-Behalf-Of)" }
        admin: { type: boolean, description: "Grant the admin permission (change policy and configuration within the key's scope)" }
        capabilities: { type: array, items: { type: string }, description: "Limit the key (see ApiKey.capabilities); none = full access" }
        preset: { type: string, enum: [agent, integration], description: "A named capability set joined with capabilities. agent = mcp, code:read, blackboard:write, plans:write, status:read, inbox:read. integration = rest, inbox:write, plans:read, runs:read, events:read" }

    ApiKeyCreateResult:
      type: object
      properties:
        key: { $ref: "#/components/schemas/ApiKey" }
        key_secret: { type: string, description: The plaintext key — shown only once }

    WorkspaceCreateInput:
      type: object
      required: [id]
      properties:
        id: { type: string, description: "Same value agents use for workspace/workspace_id." }
        name: { type: string, description: Optional display name. }
    Status:
      type: string
      description: >
        Agent status. `stuck` and `orphaned` are set exclusively by the health
        checker; agents must not self-report them.
      enum:
        - pending
        - thinking
        - planning
        - running
        - editing
        - testing
        - waiting
        - blocked
        - paused
        - handoff
        - succeeded
        - failed
        - cancelled
        - stuck
        - orphaned
    ReportInput:
      type: object
      required: [agent_id, agent_type, workspace, status]
      properties:
        session_id: { type: string }
        agent_id: { type: string }
        agent_type: { type: string }
        workspace: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        progress: { type: integer, minimum: 0, maximum: 100 }
        step_current: { type: integer, minimum: 0 }
        step_total: { type: integer, minimum: 0 }
        message: { type: string }
        snippet: { type: string }
        metadata: { type: object, additionalProperties: true }
        git_branch: { type: string }
    ReportResult:
      type: object
      properties:
        session_id: { type: string }
        event_id: { type: string }
    AgentState:
      type: object
      properties:
        session_id: { type: string }
        agent_id: { type: string }
        agent_type: { type: string }
        workspace: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        progress: { type: integer }
        step_current: { type: integer }
        step_total: { type: integer }
        message: { type: string }
        snippet: { type: string }
        metadata: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
        original_status: { $ref: "#/components/schemas/Status" }
        stuck_at: { type: string, format: date-time }
        git_branch: { type: string }
    Event:
      allOf:
        - $ref: "#/components/schemas/AgentState"
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
    SessionSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        workspace: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        agent_count: { type: integer }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          properties:
            agents:
              type: array
              items: { $ref: "#/components/schemas/AgentState" }
            events:
              type: array
              items: { $ref: "#/components/schemas/Event" }
    BlackboardScope:
      type: string
      enum: [session, branch, project]
    BlackboardEntryType:
      type: string
      enum: [finding, decision, bug, debt, warning, context]
      description: "`bug` and `debt` are floating (always visible across branches)."
    BlackboardEntry:
      type: object
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/BlackboardScope" }
        workspace_id: { type: string }
        branch_name: { type: string }
        session_id: { type: string }
        entry_type: { $ref: "#/components/schemas/BlackboardEntryType" }
        title: { type: string }
        content: { type: string }
        code_ref: { type: string }
        author_agent_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BlackboardWriteInput:
      type: object
      required: [scope, entry_type, title, author_agent_id]
      properties:
        scope: { $ref: "#/components/schemas/BlackboardScope" }
        workspace_id: { type: string }
        branch_name: { type: string, description: Required when scope is branch. }
        session_id: { type: string, description: Required when scope is session. }
        entry_type: { $ref: "#/components/schemas/BlackboardEntryType" }
        title: { type: string }
        content: { type: string }
        code_ref: { type: string }
        author_agent_id: { type: string }
    BlackboardWriteResult:
      type: object
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/BlackboardScope" }
    BlackboardBundle:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/BlackboardEntry" }
        markdown_bundle: { type: string }
    PlanStatus:
      type: string
      enum: [active, completed, archived, blocked]
    ItemStatus:
      type: string
      enum: [pending, in_progress, done, blocked]
    PlanItem:
      type: object
      properties:
        id: { type: string }
        plan_id: { type: string }
        title: { type: string }
        description: { type: string }
        phase: { type: string }
        status: { $ref: "#/components/schemas/ItemStatus" }
        position: { type: integer }
        claimed_by_agent_id: { type: string }
        depends_on:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        branch_name: { type: string }
        workspace_id: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/PlanStatus" }
        author_agent_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanItem" }
        depends_on:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreatePlanInput:
      type: object
      required: [name, author_agent_id]
      properties:
        name: { type: string }
        branch_name: { type: string }
        workspace_id: { type: string }
        description: { type: string }
        author_agent_id: { type: string }
    UpdatePlanInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/PlanStatus" }
    CreateItemInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        phase: { type: string }
        position: { type: integer, description: Omit to append at the end. }
        depends_on:
          type: array
          items: { type: string }
    UpdateItemInput:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ItemStatus" }
        claimed_by_agent_id:
          type: string
          nullable: true
          description: "null = leave unchanged, empty = release claim, set = claim."
    Run:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        item_id: { type: string }
        plan_rev_id: { type: string }
        stage: { type: string, enum: [plan, implement, review, qa, compare, synthesize, second_opinion] }
        runner: { type: string, description: "The runner the run is for: set at queue time from the stage preference, then resolved, checked against the workspace's policy and written by the claim" }
        runner_picked: { type: boolean, description: "The server chose the runner of a run nothing pinned (a requeue clears the choice)" }
        policy_rev: { type: string, description: "The effective policy the claim decided with (EffectivePolicy.rev); empty when none applied" }
        config_rev: { type: string, description: "The workspace's effective config the claim named (EffectiveConfig.rev): the worker fetches it and runs under exactly that one. Empty when the server does not manage the workspace" }
        facts:
          type: object
          description: "What the claiming worker reported about the runner (RunnerFacts fields) and the executor it reported for the run's workspace, stage and runner, plus policy (the layers' revisions, in order), rules (per layer, the index of the rule that allowed it) and picked"
        stranded: { type: string, description: "Why no worker may take this queued run under the policy; empty when not stranded. Recorded once as run.stranded" }
        worker_id: { type: string, description: Affinity owner }
        status: { type: string, enum: [queued, claimed, running, paused, succeeded, failed, interrupted, cancelled] }
        resume_kind: { type: string, enum: ["", session, branch] }
        lease_expires_at: { type: string, format: date-time }
        resume_after: { type: string, format: date-time, description: Quota reset — a paused run past it is reclaimable by its owner via any claim }
        attempt: { type: integer }
        lease_token: { type: string, description: "Only in the claim answer: the fencing token the worker presents (X-Skopos-Lease) on every later call for this attempt" }
        mcp: { $ref: "#/components/schemas/RunMCP" }
        agent_token: { type: string, description: "Only in the claim answer: the run's own credential for skopos over MCP (skr_…). Valid while this attempt is claimed or running with a live lease; a report, pause, requeue or cancel ends it. Scoped to the run's workspace, MCP only, the stage's tools only" }
        branch: { type: string }
        base_sha: { type: string }
        head_sha: { type: string }
        result_summary: { type: string }
        diffstat: { type: string }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              passed: { type: boolean }
              output: { type: string }
              stopped: { type: boolean, description: "The check never finished: check_timeout or quiet_timeout stopped it" }
        log_ref: { type: string }
        fail_reason: { type: string }
        executor: { type: string, description: "What contained the agent on the worker: local, host:<name>, wrapper:<name>:<hash>, sandbox:<hash> or runner:<kind>" }
        grants: { type: string, description: "A hash of the capabilities the stage profile granted the run; empty when none" }
        group_id: { type: string, description: Set when the run is one member of a multi-agent stage group }
        focus: { type: string, description: 'The member''s focus brief (.skopos/focus/<name>.md, read at the approved base)' }
        cost_usd: { type: number }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        retries: { type: integer, description: How often a retryable failure sent the run back to the queue }
        retry_after: { type: string, format: date-time, description: A requeued run is not claimable before this }
        avoid_worker: { type: string, description: The worker that failed it last; kept off it until retry_after + 30 minutes }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Finding:
      type: object
      required: [severity, text]
      properties:
        severity: { type: string, enum: [blocking, nit], description: Blocking findings fail the review; nits never block }
        text: { type: string }
        file: { type: string, description: "path:line" }

    RunGroup:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        item_id: { type: string }
        stage: { type: string, enum: [plan, review, qa] }
        round: { type: integer, description: 1, 2, … per item and stage }
        size: { type: integer }
        policy: { type: string, enum: [any-blocks, majority, all-pass, candidates] }
        early_exit: { type: boolean }
        state: { type: string, enum: [open, decided, cancelled] }
        outcome: { type: string, enum: [pass, fail, candidates, timeout] }
        base_sha: { type: string }
        deadline_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: "#/components/schemas/Run" }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        action: { type: string, description: "dot-namespaced domain.verb, e.g. inbox.queue" }
        actor: { type: string, description: '"root", "key <name>", "agent <id>", "system" or "migration"' }
        actor_key_id: { type: string }
        via: { type: string, description: "dashboard, slack, cli, mcp, worker, migration, system" }
        notes: { type: string }
        created_at: { type: string, format: date-time }

    PlanRevision:
      type: object
      properties:
        id: { type: string }
        plan_id: { type: string }
        workspace_id: { type: string }
        revision_no: { type: integer }
        steps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              description: { type: string }
              phase: { type: string }
              position: { type: integer }
        content_hash: { type: string, description: SHA-256 of the canonical steps encoding (plus the skills, when any are selected) }
        skills:
          type: array
          items: { type: string }
          description: Repo skills the plan selected — part of the approved content
        base_sha: { type: string, description: The commit the planner read }
        group_id: { type: string, description: 'Candidates only: the plan group that produced it' }
        label: { type: string, description: 'Candidates only: its planner ("runner" / "focus@runner")' }
        candidate_state: { type: string, enum: [open, approved, superseded], description: 'Candidates only' }
        created_at: { type: string, format: date-time }
        locked_at: { type: string, format: date-time, nullable: true }

    ApprovalEntry:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        item_id: { type: string }
        gate: { type: string, enum: [plan, review] }
        subject: { type: string, description: '"<revision_id>+<base_sha>" for plan, "<head_sha>" for review' }
        decision: { type: string, enum: [approved, rejected, changes_requested] }
        actor: { type: string }
        actor_key_id: { type: string }
        via: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }

    MigrationReport:
      type: object
      properties:
        dry_run: { type: boolean }
        migrated:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              from: { type: string }
              to: { type: string }
              tag: { type: string }
        skipped:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              status: { type: string }
              tags: { type: array, items: { type: string } }
              reason: { type: string }
        unchanged: { type: integer }
        waiting_quota:
          type: array
          items:
            type: object
            properties:
              item_id: { type: string }
              reason: { type: string }

    EventPayload:
      type: object
      description: "Standard Webhooks payload: thin, ids and state only; read details from /api/inbox/{id}/state"
      properties:
        id: { type: string, description: "msg_…, also the webhook-id header" }
        type: { type: string }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          properties:
            seq: { type: integer, description: "The event's place in the log (the feed cursor); a receiver can ignore an event older than one it handled" }
            item_id: { type: string }
            workspace_id: { type: string }
            ref: { type: string }
            external_url: { type: string }
            status: { type: string, description: The item's status when the event was recorded }
            links:
              type: object
              properties:
                api: { type: string }
                dashboard: { type: string }

    FeedPage:
      type: object
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/EventPayload" } }
        next_after: { type: integer }

    WebhookInput:
      type: object
      properties:
        name: { type: string }
        url: { type: string, description: "https (http only to hosts in integrations.allow_http); private addresses only inside integrations.allow_private" }
        workspaces: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string }, description: Workspace group names or ids (root only) }
        types: { type: array, items: { type: string }, description: "Event types; empty = every type but run.started and run.finished" }
        enabled: { type: boolean, description: Update only }

    Webhook:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        workspaces: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }
        types: { type: array, items: { type: string } }
        enabled: { type: boolean }
        disabled_reason: { type: string, description: "Who disabled it, a 410 Gone, or 3 days of failed deliveries" }
        failing_since: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookWithSecret:
      type: object
      properties:
        webhook: { $ref: "#/components/schemas/Webhook" }
        secret: { type: string, description: "whsec_…, shown only once" }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        event_seq: { type: integer }
        item_id: { type: string }
        state: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        next_at: { type: string, format: date-time }
        last_code: { type: integer }
        last_error: { type: string }
        last_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        attempts_log:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              code: { type: integer }
              error: { type: string }
              duration_ms: { type: integer }

    RunCheck:
      type: object
      properties:
        name: { type: string }
        passed: { type: boolean }
        output: { type: string }
        stopped: { type: boolean, description: "The check never finished: check_timeout or quiet_timeout stopped it" }

    ItemState:
      type: object
      properties:
        item:
          type: object
          properties:
            id: { type: string }
            workspace_id: { type: string }
            title: { type: string }
            ref: { type: string }
            external_url: { type: string }
            branch: { type: string }
            flow: { type: string }
            agents: { type: string }
            status: { type: string }
            plan_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        turn: { type: string, enum: [person, agent, none] }
        gate: { type: string, enum: [plan_approval, sign_off, blocked, failed] }
        reason: { type: string, description: "Why a blocked or failed item stopped" }
        brief: { type: string, description: "The item's own text, without the pipeline's sections" }
        plan:
          type: object
          properties:
            plan_id: { type: string }
            revisions:
              type: array
              description: "The open candidates of the current round, else the newest revision"
              items:
                type: object
                properties:
                  revision_id: { type: string }
                  revision_no: { type: integer }
                  label: { type: string }
                  content_hash: { type: string }
                  base_sha: { type: string }
                  locked: { type: boolean }
                  skills: { type: array, items: { type: string } }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string }
                        phase: { type: string }
                        position: { type: integer }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              set_id: { type: string }
              asker: { type: string }
              label: { type: string }
              text: { type: string }
              options: { type: array, items: { type: string } }
              blocking: { type: boolean }
        implementation:
          type: object
          properties:
            run_id: { type: string }
            status: { type: string }
            head_sha: { type: string }
            pushed: { type: boolean }
            pr_url: { type: string }
            diffstat: { type: string }
            summary: { type: string }
            fail_reason: { type: string }
            setup: { type: array, items: { $ref: "#/components/schemas/RunCheck" } }
            checks: { type: array, items: { $ref: "#/components/schemas/RunCheck" } }
            fix_rounds: { type: integer }
        reviews:
          type: array
          items:
            type: object
            properties:
              run_id: { type: string }
              stage: { type: string }
              runner: { type: string }
              focus: { type: string }
              head_sha: { type: string }
              status: { type: string }
              passed: { type: boolean, description: "Succeeded with no blocking finding" }
              blocking: { type: integer }
              nits: { type: integer }
              summary: { type: string }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    severity: { type: string, enum: [blocking, nit] }
                    text: { type: string }
                    file: { type: string }
        run:
          type: object
          properties:
            id: { type: string }
            stage: { type: string }
            status: { type: string }
            runner: { type: string }
            phase: { type: string }
            worker_id: { type: string }
            created_at: { type: string, format: date-time }
        actions:
          type: array
          items: { type: string, enum: [queue, review, approve, request-changes, answers, retry, reject, mark-done, second-opinion] }

    InboxItem:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        title: { type: string }
        content:
          type: string
          description: Raw markdown; present on detail reads, dropped from list rows.
        content_html:
          type: string
          description: Dashboard-safe rendering (goldmark + bluemonday); detail reads only.
        excerpt: { type: string, description: Plain-text preview; list rows only. }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [open, in_progress, queued, planning, awaiting_approval, approved, implementing, in_review, blocked, failed, converted, done, discarded] }
        priority:
          type: integer
          nullable: true
          description: Present when prioritized; items without it sort after all prioritized ones.
        claimed_by_agent_id: { type: string }
        author_agent_id: { type: string }
        agents: { type: string, enum: [panel, solo], description: "Per-item multi-agent switch; absent = the repository default" }
        branch: { type: string, description: "The branch the item works on (empty = the worker names it)" }
        ref: { type: string, description: "External reference, the branch template's {ref}" }
        flow: { type: string, enum: [review], description: "review = a review-only item" }
        external_url: { type: string, description: "Link to the item's job in another system" }
        start_error: { type: string, description: "On a create with start: why the item was created but not started" }
        plan_id: { type: string }
        plan:
          type: object
          nullable: true
          description: Linked plan summary on converted items.
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: string }
        answers_matched:
          type: array
          description: On an action's response, what its answers were read as.
          items:
            type: object
            properties:
              line: { type: string }
              question_id: { type: string }
              set_id: { type: string }
              n: { type: integer }
              option: { type: string }
              general: { type: boolean }
        content_parts:
          type: object
          description: "With ?parts=1 on GET /api/inbox/{id}: the author's text, then the pipeline's sections in rounds (a plan with its questions and the author's notes on it; a review with change requests). A round closed by the author's notes asks nothing open."
          properties:
            brief_html: { type: string }
            rounds:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [plan, questions, amendment, review, qa, second_opinion, notes] }
                  title: { type: string }
                  n: { type: integer, description: 1-based count among rounds of the same kind }
                  closed: { type: boolean }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        heading: { type: string }
                        html: { type: string }
                        label: { type: string, description: "Who asked, on a questions section: a plan candidate's label, or \"the implementer\"" }
                        questions:
                          type: array
                          items:
                            type: object
                            properties:
                              text: { type: string }
                              options: { type: array, items: { type: string }, description: Answered by letter, a b c… in order }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
