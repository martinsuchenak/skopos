  /api/plans/{id}/items/{item_id}/dependencies/{depends_on_id}:
    delete:
      summary: Remove an item dependency (re-evaluates blocked state)
      operationId: removeItemDependency
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - { $ref: "#/components/parameters/ItemId" }
        - { name: depends_on_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Not found }
  /api/plans/{id}/dependencies:
    post:
      summary: Add a plan-to-plan dependency (auto-blocks the dependent plan)
      operationId: addPlanDependency
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depends_on_plan_id]
              properties:
                depends_on_plan_id: { type: string }
      responses:
        "200":
          description: Updated dependent plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Not found }
        "409": { description: Dependency cycle detected }
  /api/plans/{id}/dependencies/{depends_on_id}:
    delete:
      summary: Remove a plan-to-plan dependency
      operationId: removePlanDependency
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - { name: depends_on_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential (or root key required)" }
        "404": { description: Not found }
  /api/inbox:
    post:
      summary: Capture an inbox item (unprocessed work)
      operationId: createInboxItem
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, author_agent_id]
              properties:
                workspace_id: { type: string, description: "Omit for an UNFILED capture (root only — unfiled items are invisible to scoped keys until filed); required for scoped keys" }
                title: { type: string }
                content: { type: string, description: Markdown (source of truth) }
                tags: { type: array, items: { type: string } }
                priority: { type: integer, description: "1+ prioritizes (smaller first; unprioritized sort last); omit or 0 for none" }
                author_agent_id: { type: string }
                agents: { type: string, enum: [panel, solo], description: "Multi-agent stages for this item: the repository's agent panel or one agent; omit for the repository default (--agents-default)" }
                branch: { type: string, description: "The branch to work on: an existing one is taken over (handover, review), a new one is created under this name. Omit to let the worker name it" }
                ref: { type: string, description: "External reference (e.g. a work request number) for the repository's branch template ({ref}); GET /api/inbox?ref= finds the item by it" }
                external_url: { type: string, description: "https link to the item's job in another system" }
                start: { type: string, enum: [queue, review], description: "Start the item right after creating it: queue (the pipeline) or review (review-only; needs branch or ref). Needs the approver permission and workspace_id. A start that fails leaves the item open and sets start_error" }
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string }, description: "Makes a retry safe (see the API description)" }
      responses:
        "201":
          description: Item captured (and started, with start)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential, or start without the approver permission" }
        "409": { description: "A request with this Idempotency-Key is still running" }
        "422": { description: "This Idempotency-Key was used for a different request" }
    get:
      summary: List inbox items (rows carry an excerpt; detail is a GET away)
      operationId: listInboxItems
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, converted, done, discarded] } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, description: Substring match on title and content } }
        - { name: ref, in: query, schema: { type: string }, description: "Exact external reference: the items of one job, in any status unless status is given" }
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Invalid status filter }
        "401": { description: Unauthorized }
        "403": { description: "Workspace out of scope for this credential" }
    delete:
      summary: Bulk-delete items in one workspace (every status, or one with status)
      operationId: purgeInboxItems
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, required: true, schema: { type: string }, description: Workspace to purge (required for every principal, root included; unfiled items are never matched) }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, converted, done, discarded] }, description: Limit the purge to one status; omit for all statuses }
      responses:
        "200":
          description: "Purge result: { deleted: N }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "400": { description: Missing/invalid workspace_id or status }
        "401": { description: Unauthorized }
        "403": { description: Workspace out of scope for this credential }
  /api/inbox/reorder:
    post:
      summary: Assign explicit priorities 1..N to the posted id order (board drag-and-drop)
      operationId: reorderInboxItems
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Item ids in the desired order; all must be open or in_progress.
      responses:
        "204": { description: Reordered }
        "400": { description: Invalid input (empty, duplicate ids, or non-editable status) }
        "401": { description: Unauthorized }
        "404": { description: "An id does not exist (or is out of scope)" }
  /api/inbox/{id}:
    get:
      summary: Get an inbox item (full markdown + rendered content_html + linked plan)
      operationId: getInboxItem
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/InboxItemId" }
        - name: parts
          in: query
          required: false
          schema: { type: string }
          description: Any non-empty value adds content_parts — the content cut into the author's text and the pipeline's rounds, with each questions section's questions parsed.
      responses:
        "200":
          description: Item detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
    patch:
      summary: Enrich an item (title/content/tags; frozen after in_progress)
      operationId: updateInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                tags: { type: array, items: { type: string } }
                priority: { type: integer, description: "1+ sets, 0 clears (unordered); omit to keep" }
                workspace_id: { type: string, description: "Files (or re-files) the item into this workspace; open/in_progress items only" }
                agents: { type: string, enum: [panel, solo, default, ""], description: "Multi-agent switch: panel, solo, or default/\"\" to follow the repository default; omit to keep. Approver-only once the item is in the agent workflow" }
                branch: { type: string, description: "The branch to work on; \"\" clears it. Approver-only once the item is in the agent workflow" }
                ref: { type: string, description: "External reference for the branch template; \"\" clears it. Approver-only once the item is in the agent workflow" }
                external_url: { type: string, description: "https link to the item's job elsewhere; \"\" clears it" }
      responses:
        "204": { description: Updated }
        "403": { description: "Filing target workspace out of scope for this credential" }
        "400": { description: Invalid input or frozen item }
        "401": { description: Unauthorized }
        "404": { description: Not found }
    delete:
      summary: Hard-delete an inbox item
      operationId: deleteInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/inbox/{id}/claim:
    post:
      summary: Claim an open item (or release with an empty agent_id)
      operationId: claimInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string, description: Claiming agent; empty string releases }
      responses:
        "200":
          description: Claimed (or released) item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Invalid state transition }
        "401": { description: Unauthorized }
        "404": { description: Not found }
        "409": { description: Item already claimed by another agent }
  /api/inbox/{id}/convert:
    post:
      summary: Link an existing plan and move the item to converted
      operationId: convertInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
      responses:
        "200":
          description: Converted item (with plan summary)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: "Plan/item workspace mismatch, or the item is unfiled/discarded" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
        "409": { description: Item already converted }
  /api/inbox/{id}/discard:
    post:
      summary: Discard an item (won't do; restorable)
      operationId: discardInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "204": { description: Discarded }
        "400": { description: Item is terminal (done) }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/inbox/{id}/restore:
    post:
      summary: Restore a discarded item back to open (undo an accidental discard)
      operationId: restoreInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "204": { description: Restored }
        "400": { description: Only discarded items can be restored (done is terminal) }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/inbox/{id}/complete:
    post:
      summary: Manually mark an item done (work finished without a plan, or ahead of it)
      operationId: completeInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "204": { description: Completed }
        "400": { description: "Item is already done, or is discarded (restore it first)" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/inbox/{id}/reopen:
    post:
      summary: Bring a done item back to open (undo a wrong manual complete; clears claim, plan link, and priority)
      operationId: reopenInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "204": { description: Reopened }
        "400": { description: Only done items can be reopened }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/{id}/queue:
    post:
      summary: Queue an open item for agent work (approver permission required)
      description: First human action of the agent pipeline (agent-pipeline §1); moves open → queued.
      operationId: queueInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: Queued item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/review:
    post:
      summary: Queue a review-only item (approver permission required)
      description: The agent runs the repository's checks on the item's existing branch and reviews it; nothing is planned or implemented. Needs the item's branch, or the reference the repository's branch template names it by. open → queued (flow review); the item reaches in_review whatever the verdict. Changes requested there turn it into a handover (planned first).
      operationId: reviewInboxBranch
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: Queued item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition, or no branch or reference }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/approve:
    post:
      summary: Approve the plan under review, bound to the revision the approver saw (approver permission required)
      description: awaiting_approval → approved. revision_id is required — the revision the approving client rendered (GET /api/plans/{plan_id}/revisions); a newer revision or a plan edited after its snapshot is refused with 409. Notes are appended to the item as "## Approval notes" for the implementer.
      operationId: approveInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                notes: { type: string }
                answers: { $ref: "#/components/schemas/Answers" }
                revision_id: { type: string, description: The revision the approving client rendered }
                content_hash: { type: string, description: Optional stronger binding to the revision's content hash }
      responses:
        "200":
          description: Approved item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Missing revision_id, illegal transition, no linked plan, or no revision }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }
        "409": { description: Stale revision }

  /api/inbox/{id}/request-changes:
    post:
      summary: Send the item back one phase with review notes (approver permission required)
      description: awaiting_approval → planning, in_review → implementing; the notes (and answers) feed the next run's prompt. notes or answers is required.
      operationId: requestInboxChanges
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
                answers: { $ref: "#/components/schemas/Answers" }
                revision_id:
                  type: string
                  description: >-
                    At a multi-agent plan gate: the open candidate to revise —
                    one planner (its runner) re-plans from it with the notes.
                    Omitted, every planner re-plans (a new round). Either way
                    the round's open candidates are superseded.
      responses:
        "200":
          description: Item returned to planning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/second-opinion:
    post:
      summary: Ask for an advisory second opinion on the item's current head (approver)
      description: >-
        Queues one extra review of the exact head the item is waiting on (its
        newest successful implementation), by the named runner or the
        workspace's default second-opinion runner. Allowed at in_review, or
        when the item is blocked by its review. The result is appended to the
        item as "Second opinion — <runner> @ <sha>"; the item's status never
        changes. Audited as inbox.second_opinion.
      operationId: inboxSecondOpinion
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runner: { type: string, description: "Runner to review with; omit for the workspace default" }
                force: { type: boolean, description: "Run it even if this runner already reviewed this head" }
                via: { type: string, description: Surface label for the audit log }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  runner: { type: string }
                  head_sha: { type: string }
        "400": { description: "Not applicable (status, no implemented head, no runner and no default)" }
        "401": { description: Unauthorized }
        "403": { description: "Requires the approver permission; or the workspace's runner policy does not allow the runner for second opinions (the body then carries reason: policy)" }
        "404": { description: Not found or out of scope }
        "409": { description: "One is already running for the item, or this runner already reviewed this head (pass force)" }

  /api/inbox/{id}/retry:
    post:
      summary: Answer a blocked or failed item and resume it (approver permission required)
      description: blocked/failed → planning or implementing; the answer feeds the next run's prompt. answer is free text and answers a list by question id (or free text); both are read against the open questions and recorded (GET /api/inbox/{id}/questions). Open questions left unanswered are recorded as skipped.
      operationId: retryInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answer: { type: string }
                answers: { $ref: "#/components/schemas/Answers" }
      responses:
        "200":
          description: Item back to implementing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/reject:
    post:
      summary: Discard the item from any workflow phase (approver permission required)
      operationId: rejectInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        "200":
          description: Discarded item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/mark-done:
    post:
      summary: Complete the reviewed item (approver permission required)
      description: in_review → done, the workflow's terminal human action.
      operationId: markInboxItemDone
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: Completed item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/transition:
    post:
      summary: System transition along the machine phases (executor path; workspace scope required, not approver-gated)
      description: queued → planning, planning → awaiting_approval, approved → implementing, implementing → in_review / awaiting_approval (amendment) / blocked / failed.
      operationId: transitionInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [planning, awaiting_approval, implementing, in_review, blocked, failed]
                reason: { type: string }
                via: { type: string, description: Audit label (worker, cli, …) }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Illegal transition }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/{id}/state:
    get:
      summary: Everything another system needs to show the item and act on it
      description: >
        Whose turn it is and which gate the item waits at, the brief, the plan
        revisions at the gate (approve one with its revision_id and
        content_hash), open questions, the newest implementation with its
        checks and pull request, the reviews of the newest reviewed head, the
        run in progress, and the actions the caller may take now. Each action
        is the endpoint to POST: /api/inbox/{id}/<action>. Actions need the
        approver permission; other keys get none. A key limited by
        capabilities sees plan only with plans:read, and reason,
        implementation, reviews and run only with runs:read.
      operationId: inboxItemState
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: The item's state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemState" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/inbox/{id}/timeline:
    get:
      summary: The item's workflow history (audit log filtered to this item)
      operationId: inboxItemTimeline
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: Audit entries, newest-first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/questions:
    get:
      summary: The decision log across items
      description: Every question in scope with its state and current answer (who answered, via, action, approval, the wait), and the answers given when no question was open (kind free), oldest first. Scoped keys see their workspaces only. format=csv returns every matching row as CSV.
      operationId: searchQuestions
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, schema: { type: string } }
        - { name: item_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [open, answered, answered_free_text, skipped, superseded, free] } }
        - { name: asker, in: query, schema: { type: string, enum: [planner, implementer, worker] } }
        - { name: answered_by, in: query, schema: { type: string }, description: 'The answering actor as recorded ("key martin", "root")' }
        - { name: from, in: query, schema: { type: string }, description: "A UTC date (2026-11-01) or an RFC 3339 time with offset; asked at or after" }
        - { name: to, in: query, schema: { type: string }, description: "A UTC date (the whole day) or an RFC 3339 time with offset; asked before" }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        "200":
          description: A page of rows (or the CSV)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { $ref: "#/components/schemas/QuestionRow" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
            text/csv:
              schema: { type: string }
        "400": { description: An unknown state or a bad date }
        "401": { description: Unauthorized }

  /api/inbox/questions/summary:
    get:
      summary: Counts over the decision log
      description: The same filters as /api/inbox/questions. Asked, answered, answered in free text, skipped, open, superseded, free answers, corrections (and those after a run used the answer) and the median wait from asked to the first answer or skip — in total, per workspace and per person (per person counts what they answered, skipped and corrected).
      operationId: questionsSummary
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: workspace_id, in: query, schema: { type: string } }
        - { name: item_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: asker, in: query, schema: { type: string } }
        - { name: answered_by, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { $ref: "#/components/schemas/QuestionCounts" }
                  by_workspace: { type: object, additionalProperties: { $ref: "#/components/schemas/QuestionCounts" } }
                  by_person: { type: object, additionalProperties: { $ref: "#/components/schemas/QuestionCounts" } }
        "400": { description: An unknown state or a bad date }
        "401": { description: Unauthorized }

  /api/inbox/{id}/questions:
    get:
      summary: The item's questions and answers
      description: Every set of questions the planner, the implementer or the worker asked, in order, each question with its state (open, answered, answered_free_text, skipped, superseded) and its answers — who answered, through which surface, with which action and approval. open counts the questions still waiting.
      operationId: inboxItemQuestions
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema:
                type: object
                properties:
                  sets: { type: array, items: { $ref: "#/components/schemas/QuestionSet" } }
                  free: { type: array, items: { $ref: "#/components/schemas/Answer" }, description: Answers given with an action when no question was open (an answer to a blocker) }
                  open: { type: integer }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/{id}/answers:
    post:
      summary: Answer the open questions without moving the item (approver permission required)
      description: While the item waits for the approver (awaiting_approval, blocked, failed). Answers by question id or free text (Answers); answering an answered question again is a correction and names the answer it replaces. Recorded with via and actor, appended as "## Answers"; the next run's prompt reads them.
      operationId: answerInboxItem
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { $ref: "#/components/schemas/Answers" }
      responses:
        "200":
          description: The item, with answers_matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Not waiting for the approver, no answers, or an answer refused (unknown question, superseded, a correction without replaces) }
        "401": { description: Unauthorized }
        "403": { description: Approver permission required }
        "404": { description: Not found }

  /api/inbox/{id}/amend-plan:
    post:
      summary: Pause the run and snapshot the amended plan over the locked revision (executor path)
      description: implementing → awaiting_approval plus a new superseding revision, inseparably — the only way to unlock approved content.
      operationId: amendInboxPlan
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                base_sha: { type: string }
      responses:
        "200":
          description: Item back at the gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Item not implementing }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/{id}/link-plan:
    post:
      summary: Attach the planner's plan to a workflow item (executor path; workspace scope required)
      description: Sets plan_id without moving the item to converted — the workflow keeps its own statuses.
      operationId: linkInboxPlan
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItem" }
        "400": { description: Not a workflow item, already linked, or workspace mismatch }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/{id}/approvals:
    get:
      summary: The item's recorded decisions (plan and review gates), newest-first
      operationId: inboxItemApprovals
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/InboxItemId" }]
      responses:
        "200":
          description: Approval entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApprovalEntry" }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/plans/{id}/revisions:
    post:
      summary: Snapshot the plan's current steps as a new revision
      description: Revision 1 for a fresh plan; a later snapshot over a locked revision is the amendment path.
      operationId: createPlanRevision
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                base_sha: { type: string, description: The commit the planner read }
      responses:
        "201":
          description: Created revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanRevision" }
        "400": { description: Plan has no steps }
        "401": { description: Unauthorized }
        "404": { description: Not found }
    get:
      summary: List the plan's revisions, newest first
      operationId: listPlanRevisions
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlanRevision" }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/plans/{id}/revisions/{revision_id}/lock:
    post:
      summary: Lock a revision against structural edits (idempotent)
      description: Normally called by the approve action; structural changes then require a new revision (amendment).
      operationId: lockPlanRevision
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - name: revision_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Locked }
        "401": { description: Unauthorized }
        "404": { description: Not found }

  /api/inbox/migrate-workflow:
    post:
      summary: One-time agent-trial cutover — migrate tag state to workflow statuses (root only, workspace-scoped)
      description: Applies the frozen tag→status table within one workspace (the trial's); trial tags are stripped so reruns are no-ops. Optional links attach plans and snapshot revisions (approved items get a via:migration approval). dry_run reports without writing.
      operationId: migrateInboxWorkflow
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Migration report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationReport" }
        "401": { description: Unauthorized }
        "403": { description: Root key required }

  /api/runs:
    get:
      summary: List runs (filtered by status and/or item_id)
      operationId: listRuns
      security: [{ BearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, claimed, running, paused, succeeded, failed, interrupted, cancelled] }
        - name: item_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Runs, newest first (scoped keys see their slice)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        "401": { description: Unauthorized }

  /api/runs/groups:
    get:
      summary: An item's multi-agent stage groups with their members, newest first
      description: >-
        A group is several agents on one stage (review or qa), routed with
        --run-stage <workspace>:<stage>=[focus@]runner,… and decided once by its
        policy. Opt-in — items in workspaces with one runner per stage have none.
      operationId: listRunGroups
      security: [{ BearerAuth: [] }]
      parameters:
        - name: item_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Groups (scoped keys see their slice)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunGroup" }
        "400": { description: item_id missing }
        "401": { description: Unauthorized }

  /api/runs/{id}/pin-base:
    post:
      summary: Pin a plan group's base commit (first member wins); returns the pinned base
      description: Every planner of a multi-agent round plans at the same commit, so candidates differ in judgement, not input.
      operationId: pinRunGroupBase
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_sha]
              properties:
                base_sha: { type: string }
      responses:
        "200":
          description: The group's pinned base
          content:
            application/json:
              schema:
                type: object
                properties:
                  base_sha: { type: string }
        "400": { description: base_sha missing }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }

  /api/runs/{id}/questions:
    post:
      summary: Record a run's questions for the approver (the worker holding the claim)
      description: The planner's or the implementer's questions. Authorised like a heartbeat (worker_id, the claim's key, X-Skopos-Lease). The server records the set (who asked, about what, whether the item waits) and appends its "## Questions — …" section to the item.
      operationId: askRunQuestions
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Skopos-Lease, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, asker, questions]
              properties:
                worker_id: { type: string }
                asker: { type: string, enum: [planner, implementer, worker] }
                blocking: { type: boolean, description: The item waits on the answers }
                subject_kind: { type: string, enum: [plan_revision, base, head, none] }
                subject: { type: string, description: "<revision>+<base_sha>, <base_sha> or <head_sha>" }
                questions:
                  type: array
                  items:
                    type: object
                    required: [question]
                    properties:
                      question: { type: string }
                      options: { type: array, items: { type: string } }
      responses:
        "201":
          description: The recorded set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionSet" }
        "400": { description: Invalid input }
        "401": { description: Unauthorized }
        "404": { description: Not found or not the claim holder }

  /api/runs/{id}/questions/read:
    post:
      summary: The item's questions and answers for the run's prompt (the worker holding the claim)
      description: Authorised like a heartbeat (worker_id, the claim's key, X-Skopos-Lease). Returns the record and the prompt text rendered from it (answered questions with their current answers, questions passed unanswered, free-text answers); the answers returned are marked as used by the run (used_by_run, set once).
      operationId: readRunQuestions
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: X-Skopos-Lease, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
      responses:
        "200":
          description: The record and the prompt text
          content:
            application/json:
              schema:
                type: object
                properties:
                  sets: { type: array, items: { $ref: "#/components/schemas/QuestionSet" } }
                  free: { type: array, items: { $ref: "#/components/schemas/Answer" } }
                  prompt: { type: string }
        "401": { description: Unauthorized }
        "404": { description: Not found or not the claim holder }

  /api/runs/{id}/log:
    post:
      summary: Append lines to a run's log (the worker holding the claim)
      description: |
        The worker streams what the run's agent, setup and checks print, in batches of
        newline-delimited records. Authorised like a heartbeat: the claim's worker, key and
        lease token (X-Skopos-Worker, X-Skopos-Lease) must match — in any status, so the last
        lines may follow the report. Records that do not parse are skipped; text is cut to
        4000 bytes; a run's log stops at 8 MB with one marker line. Wakes readers waiting
        on the run (GET with `wait`).
      operationId: appendRunLog
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - { name: X-Skopos-Worker, in: header, required: true, schema: { type: string } }
        - { name: X-Skopos-Lease, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: 'One JSON record per line: {"t": <unix ms>, "src": "worker|setup|check|agent", "msg": "...", "err": true?}'
      responses:
        "200":
          description: How many records were stored
          content:
            application/json:
              schema: { type: object, properties: { stored: { type: integer } } }
        "400": { description: Missing worker or lease, or an unreadable body }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }
        "409": { description: The worker, key or lease does not hold the claim }
    get:
      summary: Read a run's log
      description: Records after the cursor (a page of batches at a time; read again with `after=cursor` while `more`), or the last `tail` records on a first read. With `wait`, a read that finds nothing new waits up to that many seconds (at most 25) for the run's next batch. Needs runs:read on a capped key.
      operationId: readRunLog
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - { name: after, in: query, schema: { type: integer, default: 0 }, description: The cursor of the previous read }
        - { name: tail, in: query, schema: { type: integer }, description: "On a first read (after=0): only the last N records" }
        - { name: wait, in: query, schema: { type: integer, maximum: 25 }, description: "Long-poll: seconds to wait for the next batch when nothing is new" }
      responses:
        "200":
          description: Log records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: integer, description: Unix ms (the worker's clock) }
                        src: { type: string, enum: [worker, setup, check, agent] }
                        msg: { type: string }
                        err: { type: boolean }
                  cursor: { type: integer }
                  more: { type: boolean }
                  truncated: { type: boolean, description: The log reached its size cap }
        "401": { description: Unauthorized }
        "404": { description: Unknown run, or out of scope }

  /api/runs/claim:
    post:
      summary: A worker polls for its next run (affinity first, then the queue by scope and stage preference)
      description: 204 when nothing matches — the honest empty, so an idle worker distinguishes an empty queue from an error.
      operationId: claimRun
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, workspaces]
              properties:
                worker_id: { type: string }
                runners: { type: array, items: { type: string } }
                workspaces: { type: array, items: { type: string } }
                version: { type: string, description: "Presence: the worker's release" }
                poll_ms: { type: integer, description: "Presence: its idle poll interval" }
                unhealthy:
                  type: object
                  additionalProperties: { type: string }
                  description: "Offered workspaces whose preflight fails on the worker (workspace → reason). None of their runs is handed out — not even the worker's own interrupted ones, which age into takeovers for other workers. Changes are posted to Slack."
                indexable: { type: array, items: { type: string }, description: "Offered workspaces whose repo the worker can fetch and index" }
                runner_facts:
                  type: array
                  items: { $ref: "#/components/schemas/RunnerFacts" }
                  description: "Every runner the worker has configured, in its order of preference. The claim resolves the one runner of each run, checks it against the workspace's policy with these facts, and — for a run nothing pins — picks the first that fits. A worker that sends none gets runs only from workspaces without a policy. A change is audited as worker.facts."
                executors:
                  type: object
                  additionalProperties: { type: array, items: { $ref: "#/components/schemas/ExecutorFact" } }
                  description: "What contains a run on the worker: per offered workspace, the executor by stage and runner. A policy rule with executor is matched on the one for the run's workspace, stage and runner. A worker that sends none gets no run whose rule needs an executor. A change is audited as worker.facts."
                server_commands: { type: boolean, description: "The worker takes a managed workspace's setup, check and preflight commands from the server (worker.server_commands). A change is audited as worker.facts." }
                fleet_rev: { type: string, description: "The runner definitions the worker holds (GET /api/fleet/config rev). A change is audited as worker.config_applied." }
                features: { type: array, items: { type: string }, description: "What the worker's release can do: run_mcp = it takes a run's MCP servers from the claim answer. A worker without it gets no run of a workspace whose config sets mcp" }
      responses:
        "200":
          description: "The claimed run (lease started). Every response carries a Skopos-Version header (the server's release; idle workers upgrade to it), and — when set — Skopos-Index-Enabled (offered workspaces with the code_index switch on) and Skopos-Index-Default (those whose default branch this worker indexes), comma-separated."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "204": { description: "Nothing for this worker (with the Skopos-Version header). Every claim answer also carries Skopos-Runner-Facts: this server reads runner_facts and names the runner of every run it hands a worker that sent them; Skopos-Fleet-Rev when runner definitions exist (their revision); and Skopos-Config-Rev when one of the offered workspaces is managed (one value for their config: a worker refetches when it changes)" }
        "400": { description: Invalid input }
        "401": { description: Unauthorized }
        "404": { description: Workspace out of scope }

  /api/runs/{id}/heartbeat:
    post:
      summary: Extend the lease (first heartbeat flips claimed to running)
      operationId: heartbeatRun
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
      responses:
        "204": { description: Lease extended }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }
        "409": { description: Lease held by another worker }
        "410": { description: "The run was cancelled (item rejected or done): the worker stops it. The error names the reason." }

  /api/runs/{id}/report:
    post:
      summary: Report the stage result; success chains the next configured stage or moves the item forward, failure blocks the item
      operationId: reportRun
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, status]
              properties:
                worker_id: { type: string }
                status: { type: string, enum: [succeeded, failed] }
                summary: { type: string }
                head_sha: { type: string }
                diffstat: { type: string }
                checks:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      passed: { type: boolean }
                      output: { type: string }
                log_ref: { type: string }
                reason: { type: string, description: On failure }
                retryable: { type: boolean, description: "On failure: the worker's problem (setup, a hung check, git, the push, the provider). The run goes back to the queue — not claimable for 1 then 5 minutes, and from the second retry not by the failing worker for 30 minutes more — until 3 attempts are spent; only then does the item block." }
                branch: { type: string }
                base_sha: { type: string }
                executor: { type: string, description: "What contained the agent. Compared with the executor the claim matched on: a difference is audited as run.executor_mismatch, and when the policy does not allow the runner with this executor the run is recorded as failed" }
                grants: { type: string, description: "A hash of the capabilities the stage profile granted the run (extra tools, env names, settings allow rules); empty when none" }
                cost_usd: { type: number, description: What the agent run cost, when the runner reports it }
                findings:
                  type: array
                  description: Review/QA structured findings
                  items: { $ref: "#/components/schemas/Finding" }
      responses:
        "200":
          description: The finished run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { description: Invalid status }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }
        "409": { description: Lease held by another worker }

  /api/runs/{id}/pause:
    post:
      summary: Pause the run keeping affinity (amendment, quota) — the owner resumes it
      operationId: pauseRun
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                reason: { type: string }
                resume_after: { type: string, format: date-time, description: Quota resets — the owner reclaims the run via any claim once past this time (restart-safe) }
      responses:
        "204": { description: Paused }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }
        "409": { description: Lease held by another worker }

  /api/runs/{id}/cancel:
    post:
      summary: The owning worker retires its own run (an abandoned stage is a cancellation, not a failure)
      operationId: cancelRun
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                reason: { type: string }
      responses:
        "204": { description: Cancelled }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }
        "409": { description: Not this worker's run }

  /api/workers:
    get:
      summary: Worker registry — runners offered and workspaces served, recorded at claim time
      description: >-
        Root and all-workspace keys see every worker. A scoped key sees only
        workers that serve at least one of its workspaces, and their workspace
        lists are cut to its scope. A row belongs to the API key that first
        wrote it; another key reusing the worker id still claims runs but does
        not change the row.
      operationId: listWorkers
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Workers seen
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    runners: { type: array, items: { type: string } }
                    workspaces: { type: array, items: { type: string } }
                    last_seen: { type: string }
                    version: { type: string, description: The worker's skopos release }
                    poll_ms: { type: integer, description: Its idle poll interval }
                    offline_at: { type: string, description: When it said goodbye (clean shutdown) }
                    unhealthy:
                      type: object
                      additionalProperties: { type: string }
                      description: Workspaces whose preflight fails on it (workspace → reason); it takes none of their work
                    paused: { $ref: "#/components/schemas/WorkerPause" }
                    runner_facts: { type: array, items: { $ref: "#/components/schemas/RunnerFacts" }, description: What the worker reports about each runner it has }
                    executors:
                      type: object
                      additionalProperties: { type: array, items: { $ref: "#/components/schemas/ExecutorFact" } }
                      description: What contains its runs, per workspace in the caller's scope
                    server_commands: { type: boolean, description: "It takes commands from the server; absent for a worker that does not say" }
                    fleet_rev: { type: string, description: The runner definitions it holds }
                    state:
                      type: string
                      enum: [busy, idle, paused, offline]
                      description: "busy: holds a claimed/running run; idle: polled within 3 poll intervals (at least 2 minutes); paused: idle with a pause in force; offline: said goodbye or silent longer"
        "401": { description: Unauthorized }

  /api/workers/{id}/pause:
    post:
      summary: Pause a worker — it takes no new work until resumed or the pause ends
      description: >-
        A paused worker claims nothing (not even its own interrupted runs) and
        skips its idle work (indexing, cleanup); a run it holds finishes. Its
        claim answers carry `Skopos-Paused` (the end, or `resume`). Allowed for
        the key the worker runs with, root, and approvers whose scope covers
        every workspace the worker serves. Audited as `worker.pause`.
      operationId: pauseWorker
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                for: { type: string, description: "A duration such as 90m or 2h" }
                until: { type: string, format: date-time }
                reason: { type: string, maxLength: 500 }
              description: Give for or until (not both); neither pauses until resumed.
      responses:
        "200":
          description: The pause in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPause" }
        "400": { description: Bad duration, an end in the past, or both for and until }
        "401": { description: Unauthorized }
        "403": { description: Approver permission over every workspace the worker serves required }
        "404": { description: No such worker in your scope }

  /api/workers/{id}/resume:
    post:
      summary: End a worker's pause
      operationId: resumeWorker
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Resumed (also when it was not paused) }
        "401": { description: Unauthorized }
        "403": { description: Approver permission over every workspace the worker serves required }
        "404": { description: No such worker in your scope }

  /api/workers/{id}/offline:
    post:
      summary: A worker's clean-shutdown goodbye (presence shows it offline at once)
      operationId: workerOffline
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Marked offline }
        "401": { description: Unauthorized }
        "404": { description: No such worker for this key }

  /api/runs/{id}:
    get:
      summary: Get one run
      operationId: getRun
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { description: Unauthorized }
        "404": { description: Unknown run }

  /api/events:
    get:
      summary: The event feed (the same events webhooks deliver), oldest first
      description: >
        Events after a cursor, in the caller's scope (a scoped key sees its
        workspaces' events). Pass next_after back as after. wait long-polls
        (seconds, at most 25) when nothing is new. A cursor older than the
        oldest kept event answers 410 with oldest_seq: events were missed;
        resync from /api/inbox/{id}/state.
      operationId: eventFeed
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: after, in: query, schema: { type: integer }, description: "Sequence number to read after (0 = from the oldest kept)" }
        - { name: types, in: query, schema: { type: string }, description: "Comma-separated event types" }
        - { name: workspace_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer }, description: "At most 500 (default 100)" }
        - { name: wait, in: query, schema: { type: integer }, description: "Seconds to wait for an event when none is new (at most 25)" }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400": { description: Invalid parameter }
        "401": { description: Unauthorized }
        "410":
          description: Events after this cursor are no longer kept
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  oldest_seq: { type: integer }
  /api/webhooks:
    post:
      summary: Create a webhook subscription (the signing secret is returned once)
      description: >
        Root for any subscription; an approver for workspaces in its scope
        (groups need root). Needs the server's integrations key. Deliveries
        follow Standard Webhooks: webhook-id, webhook-timestamp and
        webhook-signature headers, at-least-once with retries for about 27
        hours. The subscription gets events from its creation on.
      operationId: createWebhook
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        "400": { description: Invalid input (URL not allowed, unknown type, no scope) }
        "401": { description: Unauthorized }
        "403": { description: Not an approver, workspace out of scope, or a group without root }
        "409": { description: The server has no integrations key }
    get:
      summary: List the subscriptions the caller may manage
      operationId: listWebhooks
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        "401": { description: Unauthorized }
        "403": { description: Not an approver }
  /api/webhooks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: One subscription
      operationId: getWebhook
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
    patch:
      summary: Change a subscription; enabled false disables it, true re-enables it
      description: Re-enabling delivers what waited while it was disabled (events are kept for cleanup.retention_days).
      operationId: updateWebhook
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: Invalid input }
        "401": { description: Unauthorized }
        "403": { description: The new scope is outside the caller's }
        "404": { description: Not found }
    delete:
      summary: Delete a subscription and its deliveries
      operationId: deleteWebhook
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/webhooks/{id}/rotate:
    post:
      summary: Replace the signing secret (the old one also signs for 24 hours)
      operationId: rotateWebhook
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The new secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/webhooks/{id}/test:
    post:
      summary: Send a webhook.test event to this subscription
      operationId: testWebhook
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202":
          description: The queued delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/webhooks/{id}/deliveries:
    get:
      summary: The subscription's deliveries, newest first, with every attempt
      operationId: webhookDeliveries
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [pending, delivered, failed] } }
        - { name: limit, in: query, schema: { type: integer }, description: "At most 200 (default 50)" }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { description: Unauthorized }
        "404": { description: Not found }
  /api/webhooks/{id}/redeliver:
    post:
      summary: Deliver again, with the same webhook-id
      operationId: redeliverWebhook
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_id: { type: string, description: One delivery }
                since: { type: string, format: date-time, description: Every failed delivery since then }
      responses:
        "200":
          description: How many were queued again
          content:
            application/json:
              schema:
                type: object
                properties:
                  redelivered: { type: integer }
        "400": { description: Neither delivery_id nor since }
        "401": { description: Unauthorized }
        "404": { description: Not found }
webhooks:
  item.created:
    post:
      summary: "An item was created (any source)"
      description: "data: item_id, workspace_id, ref, external_url, status, seq, links (api, dashboard), plus title."
